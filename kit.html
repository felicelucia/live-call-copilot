<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kit di candidatura — Live Call Copilot</title>
<meta name="theme-color" content="#3b5bdb">
<meta name="description" content="Da un annuncio di lavoro + il tuo profilo: CV su misura e probabili domande di colloquio, generati da un'orchestra di agenti AI su modelli europei.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="assets/design-system.css">
<style>
  /* solo layout locale della pagina: tutto il resto viene dal design system */
  .topbar{display:flex;align-items:center;gap:12px;padding-top:var(--ds-s2);}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ds-accent),#7048e8);display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 5px 14px rgba(59,91,219,.3);}
  .brand{font-weight:800;font-size:var(--ds-t-base);letter-spacing:-.01em;}
  .brand small{display:block;font-weight:600;color:var(--ds-muted);font-size:var(--ds-t-xs);letter-spacing:0;}
  .hero{text-align:center;padding:var(--ds-s4) 0 0;}
  .hero p{max-width:560px;margin:8px auto 0;color:var(--ds-muted);font-size:var(--ds-t-base);}
  .srcwrap{margin-top:var(--ds-s2);}
  .counter{font-size:var(--ds-t-xs);color:var(--ds-muted);text-align:right;margin-top:4px;}
  .outhead{display:flex;align-items:center;gap:10px;}
  .outhead .ds-tabs{flex:1;}
  #copyBtn{white-space:nowrap;}
  .accline{display:flex;align-items:center;gap:8px;font-size:var(--ds-t-sm);color:var(--ds-muted);}
  .accline a{color:var(--ds-accent);font-weight:600;text-decoration:none;}
  footer{font-size:var(--ds-t-xs);color:var(--ds-muted);text-align:center;}
  #langSeg{margin-left:auto;}
</style>
</head>
<body class="ds-page">
<div class="ds-wrap">

  <div class="topbar">
    <div class="logo">🧩</div>
    <div class="brand">Live Call Copilot<small data-i="brandSub"></small></div>
    <div class="ds-seg" id="langSeg">
      <button data-lang="it" class="on">IT</button>
      <button data-lang="en">EN</button>
    </div>
  </div>

  <div class="hero">
    <h1 class="ds-h1" data-i="heroH"></h1>
    <p data-i="heroP"></p>
  </div>

  <!-- INPUT -->
  <div class="ds-card" id="formCard">
    <div class="accline" id="accLine"></div>

    <label class="ds-label" data-i="adL"></label>
    <textarea class="ds-textarea" id="jobAd" rows="7" maxlength="12000"></textarea>
    <div class="counter"><span id="adCount">0</span> / 12000</div>

    <label class="ds-label" data-i="srcL"></label>
    <div class="ds-seg" id="srcSeg">
      <button data-src="profile" class="on" data-i="srcProfile"></button>
      <button data-src="cv" data-i="srcCv"></button>
    </div>
    <div class="srcwrap" id="cvWrap" style="display:none">
      <textarea class="ds-textarea" id="cvText" rows="6" maxlength="8000" data-i-ph="cvPh"></textarea>
    </div>

    <div style="margin-top:var(--ds-s5)">
      <button class="ds-btn ds-btn-primary" id="goBtn" style="width:100%" data-i="go"></button>
    </div>
    <div class="ds-status" id="status" style="margin-top:var(--ds-s2)"></div>
  </div>

  <!-- PLANCIA -->
  <div id="planciaWrap" style="display:none">
    <h2 class="ds-h2" data-i="planciaH" style="margin-bottom:var(--ds-s3)"></h2>
    <div id="plancia"></div>
  </div>

  <!-- OUTPUT -->
  <div class="ds-card" id="outCard" style="display:none">
    <div class="outhead">
      <div class="ds-tabs">
        <button class="ds-tab on" data-tab="sarto" data-i="tabCv"></button>
        <button class="ds-tab" data-tab="intervistatore" data-i="tabQ"></button>
      </div>
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="copyBtn" data-i="copy"></button>
    </div>
    <div class="ds-prose" id="outBody" style="margin-top:var(--ds-s4)"></div>
  </div>

  <footer data-i="foot"></footer>
</div>

<script type="module">
import { createPlancia } from "./assets/plancia.js";

const $ = (id) => document.getElementById(id);
const BACKEND = location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8787";

/* ── i18n ─────────────────────────────────────────────────────────── */
const T = {
  it: {
    brandSub: "Kit di candidatura · beta",
    heroH: "Un annuncio. Il tuo profilo. Il kit completo.",
    heroP: "Tre agenti AI leggono l'annuncio e il tuo percorso, e preparano un CV su misura e le probabili domande del colloquio. I tuoi dati restano su modelli europei 🇪🇺 — sempre.",
    adL: "Annuncio di lavoro (incollalo qui)",
    srcL: "Chi sei tu?",
    srcProfile: "📇 Usa il profilo del mio account",
    srcCv: "📄 Incollo un CV",
    cvPh: "Incolla il tuo CV o i punti chiave della tua esperienza…",
    go: "✨ Genera il kit",
    working: "Gli agenti sono al lavoro…",
    planciaH: "L'orchestra al lavoro",
    tabCv: "CV su misura",
    tabQ: "Domande probabili",
    copy: "⧉ Copia markdown",
    copied: "Copiato ✓",
    foot: "Il kit è effimero: non salviamo nulla sui nostri server. Solo tu hai il risultato.",
    needLogin: "Serve un account (gratis).",
    openApp: "Apri l'app per accedere →",
    hello: "Ciao",
    plan: "piano",
    adShort: "Incolla l'annuncio (almeno 50 caratteri).",
    netErr: "Backend non raggiungibile: controlla che sia acceso.",
    labels: { queued:"in coda", working:"al lavoro", done:"fatto", error:"errore", recapTitle:"Chi ha fatto cosa", agents:"agenti", models:"modelli", euData:"dati in UE 🇪🇺", seconds:"s totali", chars:"caratteri" },
    lang: "italiano",
  },
  en: {
    brandSub: "Application Kit · beta",
    heroH: "One job ad. Your profile. The full kit.",
    heroP: "Three AI agents read the ad and your background, then craft a tailored CV and the likely interview questions. Your data stays on European models 🇪🇺 — always.",
    adL: "Job ad (paste it here)",
    srcL: "Who are you?",
    srcProfile: "📇 Use my account profile",
    srcCv: "📄 Paste a CV",
    cvPh: "Paste your CV or the key points of your experience…",
    go: "✨ Generate the kit",
    working: "The agents are at work…",
    planciaH: "The orchestra at work",
    tabCv: "Tailored CV",
    tabQ: "Likely questions",
    copy: "⧉ Copy markdown",
    copied: "Copied ✓",
    foot: "The kit is ephemeral: nothing is stored on our servers. Only you have the result.",
    needLogin: "You need a (free) account.",
    openApp: "Open the app to sign in →",
    hello: "Hi",
    plan: "plan",
    adShort: "Paste the job ad (at least 50 characters).",
    netErr: "Backend unreachable: make sure it is running.",
    labels: { queued:"queued", working:"working", done:"done", error:"error", recapTitle:"Who did what", agents:"agents", models:"models", euData:"data in EU 🇪🇺", seconds:"s total", chars:"chars" },
    lang: "english",
  },
};
let LANG = (navigator.language || "en").toLowerCase().startsWith("it") ? "it" : "en";
const t = (k) => T[LANG][k] ?? k;
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i]").forEach((el) => (el.textContent = t(el.getAttribute("data-i"))));
  document.querySelectorAll("[data-i-ph]").forEach((el) => (el.placeholder = t(el.getAttribute("data-i-ph"))));
  renderAccLine();
}
$("langSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  LANG = b.getAttribute("data-lang");
  [...$("langSeg").children].forEach((c) => c.classList.toggle("on", c === b));
  applyLang();
});

/* ── account ──────────────────────────────────────────────────────── */
let me = null;
function renderAccLine() {
  const el = $("accLine");
  if (me) {
    el.innerHTML = "";
    el.appendChild(Object.assign(document.createElement("span"), { textContent: `${t("hello")} ${me.user.name} · ${t("plan")} ${me.plan.toUpperCase()}` }));
  } else {
    el.innerHTML = `<span>${t("needLogin")}</span> <a href="index.html">${t("openApp")}</a>`;
  }
}
async function loadMe() {
  try {
    const r = await fetch(BACKEND + "/v1/me", { credentials: "include" });
    me = r.ok ? await r.json() : null;
  } catch (_) { me = null; }
  renderAccLine();
}

/* ── input ────────────────────────────────────────────────────────── */
let source = "profile";
$("srcSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  source = b.getAttribute("data-src");
  [...$("srcSeg").children].forEach((c) => c.classList.toggle("on", c === b));
  $("cvWrap").style.display = source === "cv" ? "" : "none";
});
$("jobAd").addEventListener("input", () => ($("adCount").textContent = $("jobAd").value.length));

/* ── markdown minimo (niente librerie) ────────────────────────────── */
function cleanMd(raw) {
  return String(raw).trim().replace(/^```[a-z]*\s*\n/i, "").replace(/\n```\s*$/, "").trim();
}
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  return s
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function renderMd(raw) {
  const lines = cleanMd(esc(raw)).split("\n");
  let html = "", list = null;
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of lines) {
    const h = line.match(/^(#{1,4})\s+(.*)/);
    const ul = line.match(/^\s*[-*]\s+(.*)/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (/^\s*-{3,}\s*$/.test(line)) { closeList(); html += "<hr>"; continue; }
    if (h) { closeList(); html += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`; }
    else if (ul) { if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; } html += `<li>${inline(ul[1])}</li>`; }
    else if (ol) { if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; } html += `<li>${inline(ol[1])}</li>`; }
    else if (!line.trim()) { closeList(); }
    else { closeList(); html += `<p>${inline(line)}</p>`; }
  }
  closeList();
  return html;
}

/* ── tabs + copia ─────────────────────────────────────────────────── */
const results = {}; // task → markdown grezzo
let activeTab = "sarto";
function showTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".ds-tab").forEach((b) => b.classList.toggle("on", b.getAttribute("data-tab") === tab));
  $("outBody").innerHTML = renderMd(results[tab] || "");
}
document.querySelectorAll(".ds-tab").forEach((b) =>
  b.addEventListener("click", () => showTab(b.getAttribute("data-tab"))));
$("copyBtn").addEventListener("click", () => {
  const md = cleanMd(results[activeTab] || "");
  if (!md) return;
  navigator.clipboard.writeText(md).then(() => {
    $("copyBtn").textContent = t("copied");
    setTimeout(() => ($("copyBtn").textContent = t("copy")), 1500);
  }).catch(() => {});
});

/* ── generazione ──────────────────────────────────────────────────── */
const plancia = createPlancia($("plancia"), { labels: T[LANG].labels });
function setStatus(msg, cls) { $("status").textContent = msg; $("status").className = "ds-status " + (cls || ""); }

async function generate() {
  const jobAd = $("jobAd").value.trim();
  if (jobAd.length < 50) { setStatus(t("adShort"), "err"); return; }
  const body = { jobAd, language: t("lang") };
  if (source === "cv" && $("cvText").value.trim()) body.cv = $("cvText").value.trim().slice(0, 8000);

  $("goBtn").disabled = true;
  setStatus(t("working"), "");
  results.sarto = ""; results.intervistatore = ""; results.analista = "";
  $("outCard").style.display = "none";
  $("planciaWrap").style.display = "";
  plancia.reset();
  $("planciaWrap").scrollIntoView({ behavior: "smooth", block: "start" });

  try {
    const res = await fetch(BACKEND + "/v1/kit", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || d.error || "HTTP " + res.status);
    }
    const rd = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        let ln = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!ln.startsWith("data:")) continue;
        ln = ln.slice(5).trim();
        if (!ln || ln === "[DONE]") continue;
        let ev; try { ev = JSON.parse(ln); } catch (_) { continue; }
        plancia.handleEvent(ev);
        if (ev.type === "task-delta" && ev.task in results) results[ev.task] += ev.text || "";
        if (ev.type === "kit-done") {
          $("outCard").style.display = "";
          showTab(results.sarto ? "sarto" : "intervistatore");
          setStatus("", "");
        }
      }
    }
  } catch (e) {
    setStatus(/Failed to fetch|NetworkError/i.test(e.message) ? t("netErr") : e.message, "err");
  }
  $("goBtn").disabled = false;
}
$("goBtn").addEventListener("click", generate);

applyLang();
loadMe();
</script>
</body>
</html>
