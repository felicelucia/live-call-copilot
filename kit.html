<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kit di candidatura — Live Call Copilot</title>
<meta name="theme-color" content="#3b5bdb">
<meta name="description" content="Da un annuncio di lavoro + il tuo profilo: CV su misura e probabili domande di colloquio, generati da un'orchestra di agenti AI su modelli europei.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="assets/design-system.css">
<style>
  /* solo layout locale della pagina: tutto il resto viene dal design system */
  .topbar{display:flex;align-items:center;gap:12px;padding-top:var(--ds-s2);}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ds-accent),#7048e8);display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 5px 14px rgba(59,91,219,.3);}
  .brand{font-weight:800;font-size:var(--ds-t-base);letter-spacing:-.01em;}
  .brand small{display:block;font-weight:600;color:var(--ds-muted);font-size:var(--ds-t-xs);letter-spacing:0;}
  .hero{text-align:center;padding:var(--ds-s4) 0 0;}
  .hero p{max-width:560px;margin:8px auto 0;color:var(--ds-muted);font-size:var(--ds-t-base);}
  .srcwrap{margin-top:var(--ds-s2);}
  .counter{font-size:var(--ds-t-xs);color:var(--ds-muted);text-align:right;margin-top:4px;}
  .outhead{display:flex;align-items:center;gap:10px;}
  .outhead .ds-tabs{flex:1;}
  #copyBtn{white-space:nowrap;}
  .accline{display:flex;align-items:center;gap:8px;font-size:var(--ds-t-sm);color:var(--ds-muted);}
  .accline a{color:var(--ds-accent);font-weight:600;text-decoration:none;}
  footer{font-size:var(--ds-t-xs);color:var(--ds-muted);text-align:center;}
  #langSeg{margin-left:auto;}
</style>
</head>
<body class="ds-page">
<div class="ds-wrap">

  <div class="topbar">
    <div class="logo">🧩</div>
    <div class="brand">Live Call Copilot<small data-i="brandSub"></small></div>
    <div class="ds-seg" id="langSeg">
      <button data-lang="it" class="on">IT</button>
      <button data-lang="en">EN</button>
    </div>
  </div>

  <div class="hero">
    <h1 class="ds-h1" data-i="heroH"></h1>
    <p data-i="heroP"></p>
  </div>

  <!-- INPUT -->
  <div class="ds-card" id="formCard">
    <div class="accline" id="accLine"></div>
    <!-- login/registrazione CONTESTUALE: niente salti di pagina, lo stato
         (annuncio incollato, anteprima) resta esattamente dov'è -->
    <div id="authWrap" style="display:none;margin:var(--ds-s3) 0;padding:var(--ds-s4);border:1.5px solid #d5defb;border-radius:var(--ds-r-m);background:var(--ds-accent-soft)">
      <strong data-i="authT"></strong>
      <div class="ds-muted" style="font-size:var(--ds-t-xs);margin:4px 0 10px" data-i="authSub"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input class="ds-input" id="authEmail" type="email" autocomplete="email" placeholder="nome@email.it" style="flex:2;min-width:180px">
        <input class="ds-input" id="authPass" type="password" autocomplete="current-password" placeholder="········" style="flex:1;min-width:140px">
        <button class="ds-btn ds-btn-primary ds-btn-sm" id="authLogin" data-i="authLogin"></button>
        <button class="ds-btn ds-btn-ghost ds-btn-sm" id="authSignup" data-i="authSignup"></button>
      </div>
      <div class="ds-status" id="authStatus"></div>
    </div>

    <label class="ds-label" data-i="adL"></label>
    <textarea class="ds-textarea" id="jobAd" rows="7" maxlength="12000"></textarea>
    <div class="counter"><span id="adCount">0</span> / 12000</div>

    <label class="ds-label" data-i="srcL"></label>
    <div class="ds-seg" id="srcSeg">
      <button data-src="profile" class="on" data-i="srcProfile"></button>
      <button data-src="cv" data-i="srcCv"></button>
    </div>
    <div class="srcwrap" id="cvWrap" style="display:none">
      <textarea class="ds-textarea" id="cvText" rows="6" maxlength="8000" data-i-ph="cvPh"></textarea>
    </div>

    <!-- consenso per-kit al salvataggio: spento a ogni sessione; pre-spuntato
         solo se la preferenza account autoSaveKits è attiva (sempre togglabile) -->
    <div id="saveWrap" style="display:none;margin-top:var(--ds-s4)">
      <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:var(--ds-t-sm)">
        <input type="checkbox" id="saveKit" style="margin-top:3px">
        <span><strong data-i="saveL"></strong><br><span class="ds-muted" data-i="saveNote"></span></span>
      </label>
    </div>
    <div style="margin-top:var(--ds-s5)">
      <button class="ds-btn ds-btn-primary" id="goBtn" style="width:100%" data-i="go"></button>
    </div>
    <div class="ds-status" id="status" style="margin-top:var(--ds-s2)"></div>
  </div>

  <!-- PLANCIA -->
  <div id="planciaWrap" style="display:none">
    <h2 class="ds-h2" data-i="planciaH" style="margin-bottom:var(--ds-s3)"></h2>
    <div id="plancia"></div>
  </div>

  <!-- OUTPUT -->
  <div class="ds-card" id="outCard" style="display:none">
    <div class="outhead">
      <div class="ds-tabs">
        <button class="ds-tab on" data-tab="sarto" data-i="tabCv"></button>
        <button class="ds-tab" data-tab="mail" data-i="tabMail"></button>
        <button class="ds-tab" data-tab="intervistatore" data-i="tabQ"></button>
        <button class="ds-tab" data-tab="coach" data-i="tabCoach" style="display:none"></button>
        <button class="ds-tab" data-tab="critico" data-i="tabCritico" style="display:none"></button>
      </div>
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="pdfBtn" data-i="pdf" style="display:none"></button>
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="copyBtn" data-i="copy"></button>
    </div>
    <!-- conferma "cucito su misura": solo UI, non entra mai nel PDF -->
    <div class="ds-muted" id="cvSub" style="display:none;margin-top:var(--ds-s3);font-style:italic"></div>
    <div class="ds-prose" id="outBody" style="margin-top:var(--ds-s4)"></div>
    <!-- anteprima anonima: l'analisi è visibile, il resto si sblocca con l'account -->
    <div id="previewCta" style="display:none;margin-top:var(--ds-s4);padding:var(--ds-s4);border:1.5px dashed #d5defb;border-radius:var(--ds-r-m);text-align:center">
      <strong data-i="pvT"></strong><br><span class="ds-muted" data-i="pvSub"></span>
      <div style="margin-top:10px"><button class="ds-btn ds-btn-primary ds-btn-sm" id="pvGo" data-i="pvGo"></button></div>
    </div>
    <!-- agenti on-demand: approfondimenti a richiesta sul contesto già generato -->
    <div id="agentBtns" style="display:none;margin-top:var(--ds-s4);gap:10px;flex-wrap:wrap;align-items:center">
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="coachBtn" data-i="agentCoach"></button>
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="criticoBtn" data-i="agentCritico"></button>
      <span class="ds-muted" style="font-size:var(--ds-t-xs)" data-i="agentHint"></span>
    </div>
  </div>

  <footer data-i="foot"></footer>
</div>

<script type="module" src="assets/kit-v2.js"></script>
</body>
</html>
