<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Call Copilot — il career-AI europeo</title>
<meta name="theme-color" content="#3b5bdb">
<meta name="description" content="Il copilota AI europeo per la tua carriera: un'orchestra di agenti multi-LLM prepara CV su misura, mail e colloqui — con i tuoi dati al sicuro in UE.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="assets/design-system.css">
<style>
  /* layout locale: tutto il linguaggio viene dal design system */
  .topbar{display:flex;align-items:center;gap:12px;padding-top:var(--ds-s2);}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ds-accent),#7048e8);display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 5px 14px rgba(59,91,219,.3);}
  .brand{font-weight:800;font-size:var(--ds-t-base);letter-spacing:-.01em;}
  .topbar .ds-btn{margin-left:auto;}
  .hero{text-align:center;padding:var(--ds-s6) 0 var(--ds-s4);}
  .hero h1{font-size:2.3rem;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.2;}
  .hero p{max-width:600px;margin:14px auto 0;color:var(--ds-muted);font-size:1.05rem;}
  .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:var(--ds-s5);}
  .pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--ds-s4);}
  .pillar{background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:var(--ds-r-l);padding:var(--ds-s5);box-shadow:var(--ds-sh-s);}
  .pillar .ic{font-size:1.6rem;}
  .pillar h3{margin:10px 0 6px;font-size:var(--ds-t-lg);letter-spacing:-.01em;}
  .pillar p{margin:0;color:var(--ds-muted);font-size:var(--ds-t-sm);line-height:1.6;}
  .steps{counter-reset:step;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--ds-s4);margin-top:var(--ds-s3);}
  .step{position:relative;background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:var(--ds-r-m);padding:var(--ds-s4) var(--ds-s4) var(--ds-s4) 56px;}
  .step::before{counter-increment:step;content:counter(step);position:absolute;left:16px;top:16px;width:28px;height:28px;border-radius:50%;background:var(--ds-accent-soft);color:var(--ds-accent-deep);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:var(--ds-t-sm);}
  .step b{display:block;margin-bottom:3px;}
  .step span{color:var(--ds-muted);font-size:var(--ds-t-sm);line-height:1.55;}
  .sect-title{text-align:center;margin:var(--ds-s6) 0 var(--ds-s3);}
  footer{text-align:center;font-size:var(--ds-t-xs);color:var(--ds-muted);margin-top:var(--ds-s6);line-height:1.7;}
  footer a{color:var(--ds-accent);}
  #langSeg{margin-left:12px;}
</style>
</head>
<body class="ds-page">
<div class="ds-wrap" style="max-width:960px">

  <div class="topbar">
    <div class="logo">🎧</div>
    <div class="brand">Live Call Copilot</div>
    <a class="ds-btn ds-btn-ghost ds-btn-sm" href="jobs.html" data-i="navJobs"></a>
    <a class="ds-btn ds-btn-ghost ds-btn-sm" href="index.html" data-i="openApp"></a>
    <div class="ds-seg" id="langSeg">
      <button data-lang="it" class="on">IT</button>
      <button data-lang="en">EN</button>
    </div>
  </div>

  <div class="hero">
    <h1 data-i="heroH"></h1>
    <p data-i="heroP"></p>
    <div class="cta">
      <a class="ds-btn ds-btn-primary" href="kit.html" data-i="ctaKit"></a>
      <a class="ds-btn ds-btn-ghost" href="index.html" data-i="ctaApp"></a>
    </div>
  </div>

  <div class="pillars">
    <div class="pillar"><div class="ic">🎛️</div><h3 data-i="p1H"></h3><p data-i="p1P"></p></div>
    <div class="pillar"><div class="ic">✅</div><h3 data-i="p2H"></h3><p data-i="p2P"></p></div>
    <div class="pillar"><div class="ic"><span class="ds-eu">EU</span></div><h3 data-i="p3H"></h3><p data-i="p3P"></p></div>
  </div>

  <h2 class="ds-h2 sect-title" data-i="howH"></h2>
  <div class="steps">
    <div class="step"><b data-i="s1H"></b><span data-i="s1P"></span></div>
    <div class="step"><b data-i="s2H"></b><span data-i="s2P"></span></div>
    <div class="step"><b data-i="s3H"></b><span data-i="s3P"></span></div>
  </div>

  <footer>
    <span data-i="footPriv"></span><br>
    <a href="https://github.com/felicelucia/live-call-copilot" target="_blank" rel="noopener">GitHub</a> · <span data-i="footBeta"></span>
  </footer>
</div>

<script>
(function(){
  const T={
    it:{
      openApp:"Apri l'app",
      navJobs:"🔎 Offerte",
      heroH:"Il copilota AI europeo per la tua carriera",
      heroP:"Un'orchestra di agenti AI legge l'annuncio e il tuo percorso, prepara CV su misura, mail e domande di colloquio, e ti allena a rispondere — con i tuoi dati al sicuro in Europa.",
      ctaKit:"✨ Prova il Kit gratis",
      ctaApp:"Apri l'app →",
      p1H:"Orchestrazione multi-LLM sovrana",
      p1P:"Non un modello solo: il migliore per ogni compito, scelto in trasparenza. Vedi chi lavora, su quale modello e perché — sempre.",
      p2H:"Prontezza provata",
      p2P:"Non un CV auto-dichiarato: allenamento con punteggio, kit cuciti sugli annunci veri e gap detti onestamente. Prepararsi si vede.",
      p3H:"Dati in UE",
      p3P:"I dati personali viaggiano solo su modelli europei e server in Europa. Consenso esplicito, esportazione e cancellazione totale: GDPR sul serio.",
      howH:"Come funziona",
      s1H:"Incolla l'annuncio",
      s1P:"Oppure entra in chiamata dal vivo: il copilota ascolta e suggerisce cosa dire, in tempo reale.",
      s2H:"L'orchestra lavora",
      s2P:"Quattro agenti in parallelo: analisi, CV su misura, mail di accompagnamento, domande probabili. Tutto sotto i tuoi occhi.",
      s3H:"Candidati e allenati",
      s3P:"Scarica il CV in PDF, copia la mail, prova il colloquio col simulatore e arriva preparato davvero.",
      footPriv:"I kit sono effimeri: non salviamo nulla senza il tuo consenso. Il profilo è cifrato a riposo su server europei.",
      footBeta:"open-core · beta",
    },
    en:{
      openApp:"Open the app",
      navJobs:"🔎 Jobs",
      heroH:"The European career-AI copilot",
      heroP:"An orchestra of AI agents reads the job ad and your background, crafts a tailored CV, cover email and interview questions, and trains you to answer — with your data safe in Europe.",
      ctaKit:"✨ Try the Kit for free",
      ctaApp:"Open the app →",
      p1H:"Sovereign multi-LLM orchestration",
      p1P:"Not one model: the best one for each task, chosen transparently. You see who works, on which model, and why — always.",
      p2H:"Proven readiness",
      p2P:"Not a self-declared CV: scored training, kits tailored to real ads, gaps stated honestly. Being prepared shows.",
      p3H:"Data in the EU",
      p3P:"Personal data travels only on European models and servers in Europe. Explicit consent, export and total deletion: GDPR for real.",
      howH:"How it works",
      s1H:"Paste the job ad",
      s1P:"Or join a live call: the copilot listens and suggests what to say, in real time.",
      s2H:"The orchestra works",
      s2P:"Four agents in parallel: analysis, tailored CV, cover email, likely questions. All before your eyes.",
      s3H:"Apply and train",
      s3P:"Download the CV as PDF, copy the email, rehearse the interview with the simulator and arrive truly prepared.",
      footPriv:"Kits are ephemeral: we store nothing without your consent. Your profile is encrypted at rest on European servers.",
      footBeta:"open-core · beta",
    }
  };
  let LANG=(navigator.language||"en").toLowerCase().startsWith("it")?"it":"en";
  const t=k=>T[LANG][k]||k;
  function apply(){document.documentElement.lang=LANG;document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.getAttribute("data-i")));}
  document.getElementById("langSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;LANG=b.getAttribute("data-lang");[...e.currentTarget.children].forEach(c=>c.classList.toggle("on",c===b));apply();});
  apply();
})();
</script>
</body>
</html>
