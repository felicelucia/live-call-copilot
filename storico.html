<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storico e prontezza — Live Call Copilot</title>
<meta name="theme-color" content="#3b5bdb">
<meta name="description" content="Il tuo punteggio di prontezza spiegabile e lo storico dei kit di candidatura — cifrati, esportabili, cancellabili.">
<meta name="robots" content="noindex,follow">
<!-- SITE-BASE: aggiornare al cambio dominio -->
<link rel="canonical" href="https://livecallcopilot459adf1e-api-prod.functions.fnc.fr-par.scw.cloud/app/storico.html">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="assets/design-system-v2.css">
<link rel="stylesheet" href="assets/page-storico-v1.css">
</head>
<body class="ds-page">
<a href="#main" class="skip-link" data-i="skipLink">Salta al contenuto</a>
<div class="ds-wrap">

  <header class="topbar">
    <div class="logo" aria-hidden="true">🗂</div>
    <div class="brand">Live Call Copilot<small data-i="brandSub"></small></div>
    <nav aria-label="Sezioni del sito" style="display:contents">
      <a class="ds-btn ds-btn-ghost ds-btn-sm" href="kit.html" data-i="toKit"></a>
    </nav>
    <div class="ds-seg" id="langSeg" role="group" aria-label="Lingua / Language">
      <button data-lang="it" class="on" aria-pressed="true">IT</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main id="main">
  <!-- login richiesto -->
  <div class="ds-card" id="loginCard" style="display:none;text-align:center">
    <p class="ds-muted" style="margin:0" data-i="needLogin"></p>
    <div style="margin-top:var(--ds-s3)"><a class="ds-btn ds-btn-primary" href="index.html" data-i="openApp"></a></div>
  </div>

  <!-- prontezza (eroe) -->
  <div class="ds-card" id="readyCard" style="display:none">
    <h1 class="ds-h2" data-i="readyH" style="margin-bottom:var(--ds-s4)"></h1>
    <div class="ready-hero">
      <div class="ready-num">
        <div class="n" id="readyNum">—</div>
        <div class="of">/ 100</div>
        <div class="role" id="readyRole"></div>
      </div>
      <div class="ready-break" id="readyBreak"></div>
    </div>
  </div>

  <!-- storico -->
  <div class="ds-card" id="kitsCard" style="display:none">
    <div class="khead">
      <h2 class="ds-h2" data-i="kitsH"></h2>
      <span class="quota" id="quota"></span>
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="exportAllBtn" data-i="exportAll"></button>
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="deleteAllBtn" data-i="deleteAll"></button>
    </div>
    <div id="kitList" style="margin-top:var(--ds-s2)"></div>
    <div class="ds-status" id="kStatus" role="status"></div>
    <div class="visually-hidden" id="a11yAlert" role="alert"></div>
  </div>

  <!-- dettaglio kit (sola lettura) -->
  <div class="ds-card" id="detailCard" style="display:none">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="backBtn" data-i="back"></button>
      <h2 class="ds-h2" id="detailTitle" style="flex:1"></h2>
    </div>
    <div class="ds-tabs" role="tablist" aria-label="Contenuti del kit" style="margin-top:var(--ds-s3)">
      <button class="ds-tab on" data-tab="cv" id="tab-cv" role="tab" aria-selected="true" aria-controls="detailBody" data-i="tabCv"></button>
      <button class="ds-tab" data-tab="mail" id="tab-mail" role="tab" aria-selected="false" tabindex="-1" aria-controls="detailBody" data-i="tabMail"></button>
      <button class="ds-tab" data-tab="questions" id="tab-questions" role="tab" aria-selected="false" tabindex="-1" aria-controls="detailBody" data-i="tabQ"></button>
    </div>
    <div class="ds-prose" id="detailBody" role="tabpanel" tabindex="0" aria-labelledby="tab-cv" style="margin-top:var(--ds-s4)"></div>
  </div>
  </main>

  <footer style="text-align:center" class="ds-muted" data-i="foot"></footer>
</div>

<!-- conferma accessibile (al posto dei confirm() nativi) -->
<dialog class="ds-dialog" id="confirmDlg" aria-labelledby="confirmDlgT">
  <h2 id="confirmDlgT"></h2>
  <p id="confirmDlgP"></p>
  <div class="ds-dialog-btns">
    <button class="ds-btn ds-btn-ghost ds-btn-sm" id="confirmDlgNo"></button>
    <button class="ds-btn ds-btn-primary ds-btn-sm" id="confirmDlgYes"></button>
  </div>
</dialog>

<script src="assets/lcc-core-v2.js"></script>
<script type="module" src="assets/storico-v4.js"></script>
</body>
</html>
