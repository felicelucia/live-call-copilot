<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storico e prontezza — Live Call Copilot</title>
<meta name="theme-color" content="#3b5bdb">
<meta name="description" content="Il tuo punteggio di prontezza spiegabile e lo storico dei kit di candidatura — cifrati, esportabili, cancellabili.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="assets/design-system.css">
<style>
  .topbar{display:flex;align-items:center;gap:12px;padding-top:var(--ds-s2);}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ds-accent),#7048e8);display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 5px 14px rgba(59,91,219,.3);}
  .brand{font-weight:800;font-size:var(--ds-t-base);letter-spacing:-.01em;}
  .brand small{display:block;font-weight:600;color:var(--ds-muted);font-size:var(--ds-t-xs);}
  #langSeg{margin-left:auto;}
  /* prontezza: stat-tile eroe + barre per componente (una tinta, identità nel testo) */
  .ready-hero{display:flex;gap:var(--ds-s5);align-items:flex-start;flex-wrap:wrap;}
  .ready-num{flex:0 0 auto;text-align:center;}
  .ready-num .n{font-size:3.4rem;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ds-ink);}
  .ready-num .of{color:var(--ds-muted);font-size:var(--ds-t-sm);font-weight:600;}
  .ready-num .role{margin-top:6px;font-size:var(--ds-t-sm);color:var(--ds-accent-deep);font-weight:700;max-width:160px;}
  .ready-break{flex:1;min-width:260px;display:flex;flex-direction:column;gap:var(--ds-s3);}
  .comp .row1{display:flex;align-items:baseline;gap:8px;}
  .comp .lbl{font-weight:700;font-size:var(--ds-t-sm);}
  .comp .pts{margin-left:auto;font-size:var(--ds-t-sm);color:var(--ds-ink);font-variant-numeric:tabular-nums;}
  .comp .track{height:8px;background:var(--ds-line);border-radius:4px;overflow:hidden;margin-top:5px;}
  .comp .fill{height:100%;background:var(--ds-accent);border-radius:4px;transition:width .5s;}
  .comp .why{font-size:var(--ds-t-xs);color:var(--ds-muted);margin-top:4px;}
  /* lista kit */
  .khead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .khead .ds-h2{flex:1;}
  .krow{display:flex;gap:12px;align-items:center;padding:var(--ds-s3) 0;border-bottom:1px solid var(--ds-line);flex-wrap:wrap;}
  .krow:last-child{border-bottom:none;}
  .krow .who{flex:1;min-width:200px;}
  .krow .who b{font-size:var(--ds-t-base);}
  .krow .date{color:var(--ds-muted);font-size:var(--ds-t-xs);}
  .empty{text-align:center;color:var(--ds-muted);padding:var(--ds-s5);line-height:1.7;}
  .empty a{color:var(--ds-accent);font-weight:700;}
  .quota{font-size:var(--ds-t-xs);color:var(--ds-muted);}
</style>
</head>
<body class="ds-page">
<div class="ds-wrap">

  <div class="topbar">
    <div class="logo">🗂</div>
    <div class="brand">Live Call Copilot<small data-i="brandSub"></small></div>
    <a class="ds-btn ds-btn-ghost ds-btn-sm" href="kit.html" data-i="toKit"></a>
    <div class="ds-seg" id="langSeg">
      <button data-lang="it" class="on">IT</button>
      <button data-lang="en">EN</button>
    </div>
  </div>

  <!-- login richiesto -->
  <div class="ds-card" id="loginCard" style="display:none;text-align:center">
    <p class="ds-muted" style="margin:0" data-i="needLogin"></p>
    <div style="margin-top:var(--ds-s3)"><a class="ds-btn ds-btn-primary" href="index.html" data-i="openApp"></a></div>
  </div>

  <!-- prontezza (eroe) -->
  <div class="ds-card" id="readyCard" style="display:none">
    <h1 class="ds-h2" data-i="readyH" style="margin-bottom:var(--ds-s4)"></h1>
    <div class="ready-hero">
      <div class="ready-num">
        <div class="n" id="readyNum">—</div>
        <div class="of">/ 100</div>
        <div class="role" id="readyRole"></div>
      </div>
      <div class="ready-break" id="readyBreak"></div>
    </div>
  </div>

  <!-- storico -->
  <div class="ds-card" id="kitsCard" style="display:none">
    <div class="khead">
      <h2 class="ds-h2" data-i="kitsH"></h2>
      <span class="quota" id="quota"></span>
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="exportAllBtn" data-i="exportAll"></button>
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="deleteAllBtn" data-i="deleteAll"></button>
    </div>
    <div id="kitList" style="margin-top:var(--ds-s2)"></div>
    <div class="ds-status" id="kStatus"></div>
  </div>

  <!-- dettaglio kit (sola lettura) -->
  <div class="ds-card" id="detailCard" style="display:none">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="ds-btn ds-btn-ghost ds-btn-sm" id="backBtn" data-i="back"></button>
      <h2 class="ds-h2" id="detailTitle" style="flex:1"></h2>
    </div>
    <div class="ds-tabs" style="margin-top:var(--ds-s3)">
      <button class="ds-tab on" data-tab="cv" data-i="tabCv"></button>
      <button class="ds-tab" data-tab="mail" data-i="tabMail"></button>
      <button class="ds-tab" data-tab="questions" data-i="tabQ"></button>
    </div>
    <div class="ds-prose" id="detailBody" style="margin-top:var(--ds-s4)"></div>
  </div>

  <footer style="text-align:center" class="ds-muted" data-i="foot"></footer>
</div>

<script type="module" src="assets/storico-v2.js"></script>
</body>
</html>
