<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerca offerte — Live Call Copilot</title>
<meta name="theme-color" content="#3b5bdb">
<meta name="description" content="Cerca offerte di lavoro reali e genera in un click il Kit di candidatura su misura: CV, mail e domande probabili.">
<meta name="robots" content="noindex,follow">
<!-- SITE-BASE: aggiornare al cambio dominio -->
<link rel="canonical" href="https://livecallcopilot459adf1e-api-prod.functions.fnc.fr-par.scw.cloud/app/jobs.html">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="assets/design-system-v2.css">
<style>
  .topbar{display:flex;align-items:center;gap:12px;padding-top:var(--ds-s2);}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ds-accent),#7048e8);display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 5px 14px rgba(59,91,219,.3);}
  .brand{font-weight:800;font-size:var(--ds-t-base);letter-spacing:-.01em;}
  .brand small{display:block;font-weight:600;color:var(--ds-muted);font-size:var(--ds-t-xs);}
  #langSeg{margin-left:auto;}
  .searchrow{display:grid;grid-template-columns:2fr 1.4fr auto auto;gap:10px;align-items:end;}
  @media(max-width:720px){.searchrow{grid-template-columns:1fr;}}
  .job{display:flex;gap:12px;align-items:flex-start;padding:var(--ds-s4) 0;border-bottom:1px solid var(--ds-line);}
  .job:last-child{border-bottom:none;}
  .job .body{flex:1;min-width:0;}
  .job h3{margin:0 0 3px;font-size:var(--ds-t-lg);letter-spacing:-.01em;}
  .job h3 a{color:var(--ds-ink);text-decoration:none;}
  .job h3 a:hover{color:var(--ds-accent);}
  .job .meta{color:var(--ds-muted);font-size:var(--ds-t-sm);}
  .job .snip{color:#4a5058;font-size:var(--ds-t-sm);margin-top:6px;line-height:1.55;}
  .infocard{background:var(--ds-warn-soft);border:1.5px solid #f2dcb0;border-radius:var(--ds-r-m);padding:var(--ds-s4) var(--ds-s5);color:#8a6708;font-size:var(--ds-t-sm);line-height:1.6;}
  footer{font-size:var(--ds-t-xs);color:var(--ds-muted);text-align:center;}
</style>
</head>
<body class="ds-page">
<a href="#main" class="skip-link" data-i="skipLink">Salta al contenuto</a>
<div class="ds-wrap">

  <header class="topbar">
    <div class="logo" aria-hidden="true">🔎</div>
    <div class="brand">Live Call Copilot<small data-i="brandSub"></small></div>
    <div class="ds-seg" id="langSeg" role="group" aria-label="Lingua / Language">
      <button data-lang="it" class="on" aria-pressed="true">IT</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main id="main">
  <div class="ds-card">
    <h1 class="ds-h2" data-i="h1" style="margin-bottom:var(--ds-s2)"></h1>
    <p class="ds-muted" data-i="sub" style="margin:0 0 var(--ds-s3)"></p>
    <div class="searchrow">
      <div><label class="ds-label" for="q" data-i="qL"></label><input class="ds-input" id="q" data-i-ph="qPh"></div>
      <div><label class="ds-label" for="loc" data-i="lL"></label><input class="ds-input" id="loc" data-i-ph="lPh"></div>
      <div><label class="ds-label" for="country" data-i="cL"></label><select class="ds-select" id="country">
        <option value="it" selected>Italia</option><option value="fr">France</option>
        <option value="de">Deutschland</option><option value="es">España</option>
        <option value="nl">Nederland</option><option value="be">Belgique</option>
        <option value="at">Österreich</option><option value="pt">Portugal</option>
        <option value="gb">United Kingdom</option>
      </select></div>
      <div><button class="ds-btn ds-btn-primary" id="goBtn" data-i="go"></button></div>
    </div>
    <div class="ds-status" id="status" role="status" style="margin-top:var(--ds-s2)"></div>
    <div class="visually-hidden" id="a11yAlert" role="alert"></div>
  </div>

  <div class="ds-card" id="resultsCard" style="display:none">
    <h2 class="visually-hidden" data-i="resultsH">Risultati della ricerca</h2>
    <div id="results"></div>
  </div>

  <div id="notConf" class="infocard" style="display:none"></div>
  </main>

  <footer data-i="attrib"></footer>
</div>

<script src="assets/jobs-v3.js"></script>
</body>
</html>
