<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kandra — il tuo assistente per le videochiamate</title>
<meta name="theme-color" content="#3b5bdb">
<meta name="description" content="Live Copilot: durante la chiamata ascolta e suggerisce cosa dire, in tempo reale — sul tuo dispositivo o su modelli europei.">
<!-- strumento, non pagina da indicizzare (la vetrina è landing.html) -->
<meta name="robots" content="noindex,follow">
<!-- SITE-BASE: aggiornare al cambio dominio -->
<link rel="canonical" href="https://livecallcopilot459adf1e-api-prod.functions.fnc.fr-par.scw.cloud/app/index.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/design-system-v3.css">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Copilot">
<link rel="stylesheet" href="assets/page-index-v2.css">
</head>
<body>
<a href="#main" class="skip-link" data-i18n="skipLink">Salta al contenuto</a>
<div class="wrap">

  <header class="top">
    <div class="logo" aria-hidden="true">🎧</div>
    <div class="name">Kandra</div>
    <button class="btn btn-ghost setbtn" id="settingsBtn"><span data-i18n="settings"></span></button>
    <div class="langswitch" id="langswitch" role="group" aria-label="Lingua / Language">
      <button data-lang="it" class="on" aria-pressed="true">IT</button>
      <button data-lang="en" aria-pressed="false">EN</button>
      <button data-lang="zh" aria-pressed="false">中文</button>
      <button data-lang="es" aria-pressed="false">ES</button>
    </div>
  </header>

  <main id="main">
  <!-- ═══ VISTA LIVE (principale) ═══ -->
  <div class="view" id="viewLive">

  <!-- HERO -->
  <div class="hero">
    <h1 data-i18n="heroH"></h1>
    <p data-i18n="heroP"></p>
    <div class="steps">
      <div class="step"><span class="n">1</span><span data-i18n="s1"></span></div>
      <div class="step"><span class="n">2</span><span data-i18n="s2"></span></div>
      <div class="step"><span class="n">3</span><span data-i18n="s3"></span></div>
    </div>
    <div class="privacy-chip" data-i18n="privacyChip"></div>
    <a class="kitlink" href="kit.html"><span data-i18n="kitLink"></span></a>
    <a class="kitlink" href="storico.html"><span data-i18n="histLink"></span></a>
    <a class="kitlink" href="storie.html"><span data-i18n="storiesLink"></span></a>
  </div>

  <!-- LIVE (front and center) -->
  <div class="controls">
    <button class="btn btn-listen" id="listenBtn" aria-pressed="false"><span data-i18n="listen"></span></button>
    <button class="btn btn-toggle on" id="autoBtn" aria-pressed="true"><span data-i18n="auto"></span></button>
    <button class="btn btn-primary" id="suggestBtn" disabled data-i18n="suggest"></button>
    <button class="btn btn-ghost" id="cancelBtn" style="display:none" data-i18n="cancel"></button>
    <button class="btn btn-ghost" id="floatBtn" data-i18n="float"></button>
    <button class="btn btn-ghost" id="clearBtn" data-i18n="clear"></button>
    <button class="btn btn-soft" id="installBtn" style="display:none" data-i18n="install"></button>
  </div>
  <div class="consent" data-i18n="consentLine"></div>
  <!-- onestà sul riconoscimento vocale: on-device se il browser lo garantisce, altrimenti detto -->
  <div class="stt-note" id="sttNote"></div>
  <div class="status" id="liveStatus" role="status" style="text-align:center"></div>
  <div class="visually-hidden" id="a11yAlert" role="alert"></div>

  <div class="live-grid" id="liveHome">
    <div class="box">
      <div class="bh"><h2><span class="dot" id="recDot" aria-hidden="true"></span><span data-i18n="listening"></span></h2></div>
      <div class="transcript" id="transcript" data-ph="—"></div>
      <div class="visually-hidden" id="transcriptLive" aria-live="polite"></div>
      <div style="margin-top:9px"><input type="text" id="manualQ" data-i18n-ph="manualph"></div>
    </div>
    <div class="box" id="answerBox">
      <div class="bh"><h2>💬 <span data-i18n="answer"></span></h2><button class="mini" id="copyBtn" data-i18n="copy"></button></div>
      <div class="routing" id="routingInfo" role="status"><span class="rx" aria-hidden="true">⚡</span><span id="routingText"></span></div>
      <div class="answer" id="answer" data-ph="—"></div>
      <div class="visually-hidden" id="answerLive" aria-live="polite"></div>
      <!-- Flywheel (M2-d): solo il segnale — azione + metadati, mai il testo. -->
      <div class="fbrow" id="fbRow">
        <span data-i18n="fbQ"></span>
        <button class="mini" id="fbUsed" data-i18n="fbUsed"></button>
        <button class="mini" id="fbEdited" data-i18n="fbEdited"></button>
        <button class="mini" id="fbIgnored" data-i18n="fbIgnored"></button>
      </div>
      <div id="fbEditWrap" style="display:none;margin-top:8px">
        <textarea id="fbEditText" rows="3" aria-label="La tua versione della risposta"></textarea>
        <div style="margin-top:6px"><button class="mini" id="fbEditSend" data-i18n="fbSend"></button></div>
      </div>
    </div>
  </div>

  </div><!-- /viewLive -->

  <!-- ═══ VISTA IMPOSTAZIONI (sostituisce la Live, non le va sopra) ═══ -->
  <div class="view" id="viewSettings" style="display:none">

  <div class="set-head">
    <button class="btn btn-ghost" id="backBtn" data-i18n="doneBack"></button>
    <h2 data-i18n="drawerH"></h2>
  </div>

  <div class="card" id="setupCard">
    <h2 data-i18n="startH" id="startHId"></h2>
    <p class="sub" data-i18n="startSub"></p>

    <div class="choices" role="radiogroup" aria-labelledby="startHId">
      <div class="choice sel" id="choiceFree" role="radio" aria-checked="true" tabindex="0">
        <div class="t"><span aria-hidden="true">🆓</span> <span data-i18n="freeT"></span> <span class="badge" data-i18n="reco"></span></div>
        <div class="d" data-i18n="freeD"></div>
      </div>
      <div class="choice" id="choiceOwn" role="radio" aria-checked="false" tabindex="-1">
        <div class="t"><span aria-hidden="true">🔑</span> <span data-i18n="ownT"></span></div>
        <div class="d" data-i18n="ownD"></div>
      </div>
      <div class="choice" id="choiceLocal" role="radio" aria-checked="false" tabindex="-1">
        <div class="t"><span aria-hidden="true">🔒</span> <span data-i18n="localT"></span></div>
        <div class="d" data-i18n="localD"></div>
      </div>
      <div class="choice pro" id="choicePro" role="radio" aria-checked="false" tabindex="-1">
        <div class="t"><span aria-hidden="true">⭐</span> <span data-i18n="proT"></span> <span class="badge vio" data-i18n="proBadge"></span></div>
        <div class="d" data-i18n="proD"></div>
      </div>
    </div>

    <!-- Account / piano Pro (nostro cloud) -->
    <div id="proWrap" style="display:none">
      <form id="proLoggedOut" novalidate>
        <div class="row">
          <div><label for="acEmail" data-i18n="acEmailL"></label><input type="email" id="acEmail" name="email" autocomplete="username" placeholder="nome@email.it" aria-required="true"></div>
          <div><label for="acPass" data-i18n="acPassL"></label><input type="password" id="acPass" name="password" autocomplete="current-password" placeholder="········" aria-required="true"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div><button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%" data-i18n="acLogin"></button></div>
          <div><button type="button" class="btn btn-ghost" id="signupBtn" style="width:100%" data-i18n="acSignup"></button></div>
        </div>
        <!-- §8 stato onesto delle email transazionali (reset/verifica) -->
        <div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <a href="#" class="hintlink" id="forgotLink" data-i18n="acForgot"></a>
          <span class="status" id="emailNote" role="status" style="margin:0"></span>
        </div>
      </form>
      <div id="proLoggedIn" style="display:none">
        <div class="paidnote" id="proPlanNote"></div>
        <div class="row" id="proUpgradeRow" style="display:none;margin-top:8px">
          <div><button class="btn btn-primary" id="upgradeBtn" style="width:100%" data-i18n="acUpgrade"></button></div>
          <div><button class="btn btn-soft" id="syncBtn" style="width:100%" data-i18n="acSync"></button></div>
        </div>
        <div style="margin-top:8px">
          <label for="proModel" data-i18n="proModelL"></label>
          <select id="proModel"></select>
        </div>
        <!-- Sovranità: NON è un interruttore. La trascrizione è un dato sensibile
             per natura → il server la instrada SEMPRE su modelli/server UE
             (pavimento). Un modello extra-UE si può scegliere a mano, ma il
             backend lo rifiuta finché non c'è consenso esplicito (dialog). -->
        <div class="paidnote" id="sensNote" style="margin-top:10px" data-i18n="sensNote"></div>
        <div class="paidnote" id="nonEuWarn" style="display:none;margin-top:8px;background:#fff7ec;border-color:#f2dcb0;color:#8a6d2f" data-i18n="nonEuWarn"></div>
        <div style="margin-top:10px"><button class="btn btn-ghost" id="logoutBtn" data-i18n="acLogout"></button></div>
      </div>
      <div class="status" id="acStatus" role="status"></div>
    </div>
    <div class="paidnote" id="localNote" style="display:none;background:#fff7ec;border-color:#f2dcb0;color:#8a6d2f"></div>

    <!-- Matrice modalità: dove vanno i dati, detto chiaro per ognuna delle
         tre strade. La promessa "UE" vale per la modalità sovrana, non per tutte. -->
    <table class="matrix" id="modeMatrix">
      <caption class="visually-hidden" data-i18n="mxCap"></caption>
      <thead><tr><th scope="col" data-i18n="mxMode"></th><th scope="col" data-i18n="mxWhere"></th></tr></thead>
      <tbody>
        <tr><th scope="row" data-i18n="mxLocalT"></th><td data-i18n="mxLocalD"></td></tr>
        <tr><th scope="row" data-i18n="mxByokT"></th><td data-i18n="mxByokD"></td></tr>
        <tr><th scope="row" data-i18n="mxEuT"></th><td data-i18n="mxEuD"></td></tr>
      </tbody>
    </table>

    <div id="ownWrap" style="display:none">
      <label for="provider" data-i18n="engine"></label>
      <select id="provider"></select>
    </div>

    <label id="keyLabel" for="apiKey"><span data-i18n="apikey"></span> <a class="hintlink" id="keyLink" target="_blank" data-i18n="getkey"></a></label>
    <div class="row" id="keyRow">
      <div style="flex:3"><input type="password" id="apiKey" placeholder="AIza..." autocomplete="off"></div>
      <div style="flex:1;min-width:150px;display:flex;align-items:flex-end"><button class="btn btn-soft" id="verifyBtn" style="width:100%" data-i18n="verify"></button></div>
    </div>
    <div class="status" id="setupStatus" role="status"></div>

    <div class="row" style="margin-top:6px">
      <div>
        <label for="mode" data-i18n="mode"></label>
        <select id="mode"></select>
      </div>
      <div>
        <label for="ansLang" data-i18n="answerlang"></label>
        <select id="ansLang">
          <option value="English">English</option>
          <option value="Italiano">Italiano</option>
          <option value="中文">中文</option>
          <option value="Español">Español</option>
          <option value="same">= speaker</option>
        </select>
      </div>
    </div>

    <!-- Profilo (memoria, M2): superficie UNICA di modifica — sostituisce il
         vecchio campo libero "contesto/CV". BYOK/locale: resta solo su questo
         dispositivo (localStorage). Loggato + consenso: sincronizzato
         sull'account (server UE), con esportazione e cancellazione GDPR. -->
    <div style="margin-top:14px;border-top:1px dashed var(--line);padding-top:8px">
      <label style="font-size:.92rem;color:var(--ink)" data-i18n="profH"></label>
      <p class="sub" data-i18n="profSub"></p>
      <div class="row">
        <div><label for="pfRole" data-i18n="profRoleL"></label><input id="pfRole" data-i18n-ph="profRolePh"></div>
        <div><label for="pfCompany" data-i18n="profCompanyL"></label><input id="pfCompany" data-i18n-ph="profCompanyPh"></div>
      </div>
      <label for="pfCv" data-i18n="profCvL"></label>
      <textarea id="pfCv" data-i18n-ph="profCvPh"></textarea>
      <label for="pfStyle" data-i18n="profStyleL"></label>
      <input id="pfStyle" data-i18n-ph="profStylePh">
      <label for="pfObj" data-i18n="profObjL"></label>
      <textarea id="pfObj" data-i18n-ph="profObjPh"></textarea>
      <div class="paidnote" id="profWhere" style="margin-top:10px"></div>
      <div id="profSyncWrap" style="display:none">
        <div class="checkbox">
          <input type="checkbox" id="profConsent">
          <label for="profConsent" style="margin:0" data-i18n="profConsentL"></label>
        </div>
        <div class="row" style="margin-top:10px">
          <div><button class="btn btn-ghost" id="profExportBtn" style="width:100%" data-i18n="profExport"></button></div>
          <div><button class="btn btn-ghost" id="profDeleteBtn" style="width:100%" data-i18n="profDelete"></button></div>
        </div>
        <!-- Storico kit: preferenza + diritti GDPR raggiungibili da qui -->
        <div class="checkbox" style="margin-top:12px">
          <input type="checkbox" id="autoSaveKits">
          <label for="autoSaveKits" style="margin:0" data-i18n="autoSaveL"></label>
        </div>
        <div class="row" style="margin-top:10px">
          <div><a class="btn btn-ghost" href="storico.html" style="display:block;text-align:center;text-decoration:none" data-i18n="histOpen"></a></div>
          <div><button class="btn btn-ghost" id="histExportBtn" style="width:100%" data-i18n="histExport"></button></div>
          <div><button class="btn btn-ghost" id="histDeleteBtn" style="width:100%" data-i18n="histDelete"></button></div>
        </div>
        <!-- Story Bank (M3): stessi diritti GDPR, stessa disciplina (2xx o niente) -->
        <div class="row" style="margin-top:10px">
          <div><a class="btn btn-ghost" href="storie.html" style="display:block;text-align:center;text-decoration:none" data-i18n="storiesOpen"></a></div>
          <div><button class="btn btn-ghost" id="storiesExportBtn" style="width:100%" data-i18n="storiesExport"></button></div>
          <div><button class="btn btn-ghost" id="storiesDeleteBtn" style="width:100%" data-i18n="storiesDelete"></button></div>
        </div>
      </div>
      <div class="status" id="profStatus" role="status"></div>
    </div>

    <details class="adv">
      <summary data-i18n="adv"></summary>
      <div class="row">
        <div>
          <label for="model" data-i18n="model"></label>
          <input id="model" list="modelList" placeholder="model"><datalist id="modelList"></datalist>
        </div>
        <div>
          <label for="lang" data-i18n="heard"></label>
          <select id="lang">
            <option value="en-US">English (US)</option><option value="en-GB">English (UK)</option>
            <option value="it-IT">Italiano</option><option value="es-ES">Español</option>
            <option value="zh-CN">中文</option><option value="fr-FR">Français</option>
            <option value="de-DE">Deutsch</option><option value="pt-PT">Português</option>
          </select>
        </div>
      </div>
      <div id="baseWrap" style="display:none;margin-top:8px">
        <label for="baseUrl" data-i18n="baseurl"></label>
        <input id="baseUrl" placeholder="https://...">
      </div>
      <div class="checkbox">
        <input type="checkbox" id="remember">
        <label for="remember" style="margin:0" data-i18n="remember"></label>
        <a href="#" id="forget" class="hintlink" data-i18n="forget"></a>
      </div>
    </details>

    <div class="paidnote" data-i18n="paid"></div>
  </div>

  <div class="caps">
    <h3 data-i18n="capsTitle"></h3>
    <div class="capsbody" data-i18n="capsBody"></div>
  </div>

  <details class="card">
    <summary style="cursor:pointer;font-weight:800;list-style:none" data-i18n="howto"></summary>
    <div class="foot" id="howtoBody" style="margin-top:10px"></div>
  </details>

  </div><!-- /viewSettings -->
  </main>
</div><!-- /wrap -->

<!-- conferma accessibile (al posto dei confirm() nativi) -->
<dialog class="ds-dialog" id="confirmDlg" aria-labelledby="confirmDlgT">
  <h2 id="confirmDlgT"></h2>
  <p id="confirmDlgP"></p>
  <div class="ds-dialog-btns">
    <button class="btn btn-ghost" id="confirmDlgNo"></button>
    <button class="btn btn-primary" id="confirmDlgYes"></button>
  </div>
</dialog>

<script src="assets/lcc-core-v4.js"></script>
<script src="assets/app-v14.js"></script>
</body>
</html>
