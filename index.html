<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Call Copilot — il tuo assistente per le videochiamate</title>
<meta name="theme-color" content="#3b5bdb">
<meta name="description" content="The open, private AI copilot for your calls — it listens and suggests what to say, in real time.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/design-system.css">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Copilot">
<style>
  /* Le variabili storiche della pagina puntano ai token del design system
     (assets/design-system.css): stessa lingua visiva del Kit, zero cambi
     a selettori/id/DOM. */
  :root{
    --bg:var(--ds-bg); --card:var(--ds-surface); --soft:var(--ds-accent-soft); --soft2:var(--ds-ok-soft);
    --ink:var(--ds-ink); --muted:var(--ds-muted); --line:var(--ds-line);
    --accent:var(--ds-accent); --accent-d:var(--ds-accent-deep); --teal:var(--ds-ok); --amber:var(--ds-warn); --violet:var(--ds-accent);
    --r:var(--ds-r-l); --sh:var(--ds-sh-m);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--ds-font); line-height:1.55;}
  .wrap{max-width:960px; margin:0 auto; padding:18px 18px 70px; display:flex; flex-direction:column; gap:18px;}

  /* header */
  .top{display:flex; align-items:center; gap:12px;}
  .logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--ds-accent),#7048e8);display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 6px 18px rgba(59,91,219,.35);}
  .top .name{font-weight:800; font-size:1.1rem;}
  .langswitch{margin-left:auto; display:flex; gap:3px; background:#fff; border:1px solid var(--line); border-radius:22px; padding:3px; box-shadow:var(--sh);}
  .langswitch button{background:none;border:none;color:var(--muted);font-size:.8rem;padding:6px 12px;border-radius:18px;cursor:pointer;font-family:inherit;}
  .langswitch button.on{background:var(--accent);color:#fff;font-weight:700;}

  /* hero */
  .hero{background:linear-gradient(160deg,var(--soft),#fff 70%);border:1px solid var(--line);border-radius:var(--r);padding:26px 26px 22px;box-shadow:var(--sh);text-align:center;}
  .hero h1{margin:0 0 8px;font-size:1.7rem;font-weight:800;letter-spacing:-.3px;}
  .hero p{margin:0 auto;max-width:560px;color:#6b625a;font-size:1.02rem;}
  .steps{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
  .step{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:40px;padding:8px 16px;font-size:.86rem;font-weight:600;box-shadow:0 3px 10px rgba(60,40,25,.05);}
  .step .n{width:22px;height:22px;border-radius:50%;background:var(--soft2);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);}
  .card h2{margin:0 0 4px;font-size:1.05rem;font-weight:800;}
  .card .sub{color:var(--muted);font-size:.85rem;margin:0 0 14px;}

  label{display:block;font-size:.8rem;color:#6b625a;font-weight:600;margin:11px 0 5px;}
  input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 13px;font-size:.92rem;font-family:inherit;outline:none;transition:border-color .15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:70px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row>div{flex:1;min-width:150px;}

  button.btn{cursor:pointer;border:none;border-radius:13px;font-size:.95rem;font-weight:700;font-family:inherit;padding:12px 18px;transition:transform .05s,box-shadow .15s,filter .15s;}
  button.btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(59,91,219,.3);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-soft{background:var(--soft);color:var(--accent-d);border:1.5px solid #d5defb;}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .btn-listen{background:var(--teal);color:#fff;font-size:1.05rem;padding:15px 30px;box-shadow:0 8px 20px rgba(18,184,134,.32);}
  /* in registrazione: rosso semantico (prima l'accento era già rosso-arancio) */
  .btn-listen.on{background:var(--ds-err);animation:pulse 1.5s infinite;}
  .btn-toggle{background:#fff;color:var(--muted);border:1.5px solid var(--line);}
  .btn-toggle.on{background:var(--soft2);color:var(--teal);border-color:#b8ecd8;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  @keyframes pulse{50%{filter:brightness(1.12);}}

  /* choice cards for onboarding */
  .choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:900px){.choices{grid-template-columns:1fr 1fr;}}
  @media(max-width:640px){.choices{grid-template-columns:1fr;}}
  .choice.pro{border-color:#d5defb;}
  .choice.pro:hover{border-color:var(--violet);}
  .choice.pro.sel{border-color:var(--violet);background:var(--ds-accent-soft);}
  .badge.vio{background:var(--violet);}
  /* pill di trasparenza sul routing (AI Act): chi ha risposto e perché */
  .routing{display:none;align-items:flex-start;gap:7px;background:var(--ds-accent-soft);border:1px solid #d5defb;border-radius:11px;padding:7px 11px;margin-bottom:9px;font-size:.78rem;color:var(--ds-accent-deep);line-height:1.4;}
  .routing.show{display:flex;}
  .routing b{color:var(--ds-accent-deep);}
  .routing .rx{flex:0 0 auto;}
  .choice{border:2px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s;}
  .choice:hover{border-color:#c6d3f7;}
  .choice.sel{border-color:var(--accent);background:var(--soft);}
  .choice .t{font-weight:800;font-size:.98rem;display:flex;align-items:center;gap:8px;}
  .choice .d{color:var(--muted);font-size:.82rem;margin-top:4px;}
  .badge{font-size:.68rem;font-weight:800;background:var(--teal);color:#fff;border-radius:20px;padding:2px 8px;}

  .status{font-size:.82rem;color:var(--muted);min-height:1.05em;margin-top:8px;}
  .status.ok{color:var(--teal);} .status.err{color:var(--accent-d);} .status.work{color:var(--amber);}
  .hintlink{font-size:.78rem;color:var(--accent-d);text-decoration:none;font-weight:600;}
  .checkbox{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.82rem;color:var(--muted);}
  .checkbox input{width:auto;}

  details.adv{margin-top:14px;border-top:1px dashed var(--line);padding-top:6px;}
  details.adv>summary{list-style:none;cursor:pointer;padding:10px 0;font-size:.85rem;color:var(--muted);font-weight:600;}
  details.adv>summary::-webkit-details-marker{display:none;}

  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;}
  .live-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:14px;}
  @media(max-width:820px){.live-grid{grid-template-columns:1fr;}}
  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;min-height:200px;box-shadow:var(--sh);}
  .box .bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
  .box .bh h3{margin:0;font-size:.9rem;font-weight:800;}
  .dot{width:9px;height:9px;border-radius:50%;background:#d9cec3;display:inline-block;margin-right:7px;}
  .dot.live{background:var(--ds-err);box-shadow:0 0 8px var(--ds-err);animation:pulse 1.4s infinite;}
  .transcript{flex:1;overflow-y:auto;max-height:280px;font-size:.95rem;color:#4a423b;}
  .transcript .interim{color:var(--muted);font-style:italic;}
  .transcript:empty::before{content:attr(data-ph);color:#b8ab9e;font-size:.85rem;}
  .answer{flex:1;overflow-y:auto;max-height:440px;white-space:pre-wrap;font-size:1.06rem;color:#3a332e;}
  .answer:empty::before{content:attr(data-ph);color:#b8ab9e;font-size:.85rem;}
  .answer b{color:var(--teal);}
  .mini{font-size:.74rem;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 10px;cursor:pointer;}
  /* feedback flywheel: riga discreta sotto il suggerimento */
  .fbrow{display:none;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px;font-size:.75rem;color:var(--muted);}
  .fbrow.show{display:flex;}
  a{color:var(--accent-d);}
  .foot{font-size:.78rem;color:var(--muted);}
  .paidnote{background:var(--soft2);border:1px solid #cdeede;border-radius:12px;padding:11px 14px;font-size:.82rem;color:#2f7a5e;margin-top:12px;}

  /* settings: schermata alternativa alla Live (niente overlay, niente drawer) */
  .setbtn{margin-left:auto;padding:9px 14px;}
  .langswitch{margin-left:0;}
  .privacy-chip{display:inline-flex;align-items:center;gap:7px;margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:7px 15px;font-size:.82rem;color:#3f6a58;font-weight:600;box-shadow:0 3px 10px rgba(60,40,25,.05);}
  /* ingresso al Kit di candidatura: stesso viola della pill di routing */
  .kitlink{display:inline-flex;align-items:center;gap:7px;margin-top:16px;margin-left:8px;background:var(--ds-accent-soft);border:1px solid #d5defb;border-radius:30px;padding:7px 15px;font-size:.82rem;color:var(--ds-accent-deep);font-weight:700;text-decoration:none;box-shadow:0 3px 10px rgba(23,26,32,.05);transition:border-color .15s;}
  .kitlink:hover{border-color:var(--violet);}
  .consent{text-align:center;font-size:.78rem;color:var(--muted);margin-top:2px;}
  .consent b{color:var(--accent-d);font-weight:700;}
  .view{display:flex;flex-direction:column;gap:18px;animation:viewin .22s ease;}
  @keyframes viewin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .set-head{display:flex;align-items:center;gap:14px;}
  .set-head h2{margin:0;font-size:1.15rem;font-weight:800;}
  .caps{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}
  .caps h3{margin:0 0 8px;font-size:1rem;font-weight:800;}
  .caps .capsbody{font-size:.86rem;color:#5f564e;line-height:1.62;}
  .caps .capsbody b{color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="logo">🎧</div>
    <div class="name">Live Call Copilot</div>
    <button class="btn btn-ghost setbtn" id="settingsBtn"><span data-i18n="settings"></span></button>
    <div class="langswitch" id="langswitch">
      <button data-lang="it" class="on">IT</button>
      <button data-lang="en">EN</button>
      <button data-lang="zh">中文</button>
      <button data-lang="es">ES</button>
    </div>
  </div>

  <!-- ═══ VISTA LIVE (principale) ═══ -->
  <div class="view" id="viewLive">

  <!-- HERO -->
  <div class="hero">
    <h1 data-i18n="heroH"></h1>
    <p data-i18n="heroP"></p>
    <div class="steps">
      <div class="step"><span class="n">1</span><span data-i18n="s1"></span></div>
      <div class="step"><span class="n">2</span><span data-i18n="s2"></span></div>
      <div class="step"><span class="n">3</span><span data-i18n="s3"></span></div>
    </div>
    <div class="privacy-chip" data-i18n="privacyChip"></div>
    <a class="kitlink" href="kit.html"><span data-i18n="kitLink"></span></a>
    <a class="kitlink" href="storico.html"><span data-i18n="histLink"></span></a>
  </div>

  <!-- LIVE (front and center) -->
  <div class="controls">
    <button class="btn btn-listen" id="listenBtn"><span data-i18n="listen"></span></button>
    <button class="btn btn-toggle on" id="autoBtn"><span data-i18n="auto"></span></button>
    <button class="btn btn-primary" id="suggestBtn" disabled data-i18n="suggest"></button>
    <button class="btn btn-ghost" id="floatBtn" data-i18n="float"></button>
    <button class="btn btn-ghost" id="clearBtn" data-i18n="clear"></button>
    <button class="btn btn-soft" id="installBtn" style="display:none" data-i18n="install"></button>
  </div>
  <div class="consent" data-i18n="consentLine"></div>
  <div class="status" id="liveStatus" style="text-align:center"></div>

  <div class="live-grid" id="liveHome">
    <div class="box">
      <div class="bh"><h3><span class="dot" id="recDot"></span><span data-i18n="listening"></span></h3></div>
      <div class="transcript" id="transcript" data-ph="—"></div>
      <div style="margin-top:9px"><input type="text" id="manualQ" data-i18n-ph="manualph"></div>
    </div>
    <div class="box" id="answerBox">
      <div class="bh"><h3>💬 <span data-i18n="answer"></span></h3><button class="mini" id="copyBtn" data-i18n="copy"></button></div>
      <div class="routing" id="routingInfo"><span class="rx">⚡</span><span id="routingText"></span></div>
      <div class="answer" id="answer" data-ph="—"></div>
      <!-- Flywheel (M2-d): solo il segnale — azione + metadati, mai il testo. -->
      <div class="fbrow" id="fbRow">
        <span data-i18n="fbQ"></span>
        <button class="mini" id="fbUsed" data-i18n="fbUsed"></button>
        <button class="mini" id="fbEdited" data-i18n="fbEdited"></button>
        <button class="mini" id="fbIgnored" data-i18n="fbIgnored"></button>
      </div>
      <div id="fbEditWrap" style="display:none;margin-top:8px">
        <textarea id="fbEditText" rows="3"></textarea>
        <div style="margin-top:6px"><button class="mini" id="fbEditSend" data-i18n="fbSend"></button></div>
      </div>
    </div>
  </div>

  </div><!-- /viewLive -->

  <!-- ═══ VISTA IMPOSTAZIONI (sostituisce la Live, non le va sopra) ═══ -->
  <div class="view" id="viewSettings" style="display:none">

  <div class="set-head">
    <button class="btn btn-ghost" id="backBtn" data-i18n="doneBack"></button>
    <h2 data-i18n="drawerH"></h2>
  </div>

  <div class="card" id="setupCard">
    <h2 data-i18n="startH"></h2>
    <p class="sub" data-i18n="startSub"></p>

    <div class="choices">
      <div class="choice sel" id="choiceFree">
        <div class="t">🆓 <span data-i18n="freeT"></span> <span class="badge" data-i18n="reco"></span></div>
        <div class="d" data-i18n="freeD"></div>
      </div>
      <div class="choice" id="choiceOwn">
        <div class="t">🔑 <span data-i18n="ownT"></span></div>
        <div class="d" data-i18n="ownD"></div>
      </div>
      <div class="choice" id="choiceLocal">
        <div class="t">🔒 <span data-i18n="localT"></span></div>
        <div class="d" data-i18n="localD"></div>
      </div>
      <div class="choice pro" id="choicePro">
        <div class="t">⭐ <span data-i18n="proT"></span> <span class="badge vio" data-i18n="proBadge"></span></div>
        <div class="d" data-i18n="proD"></div>
      </div>
    </div>

    <!-- Account / piano Pro (nostro cloud) -->
    <div id="proWrap" style="display:none">
      <div id="proLoggedOut">
        <div class="row">
          <div><label data-i18n="acEmailL"></label><input type="email" id="acEmail" autocomplete="email" placeholder="nome@email.it"></div>
          <div><label data-i18n="acPassL"></label><input type="password" id="acPass" autocomplete="current-password" placeholder="········"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div><button class="btn btn-primary" id="loginBtn" style="width:100%" data-i18n="acLogin"></button></div>
          <div><button class="btn btn-ghost" id="signupBtn" style="width:100%" data-i18n="acSignup"></button></div>
        </div>
      </div>
      <div id="proLoggedIn" style="display:none">
        <div class="paidnote" id="proPlanNote"></div>
        <div class="row" id="proUpgradeRow" style="display:none;margin-top:8px">
          <div><button class="btn btn-primary" id="upgradeBtn" style="width:100%" data-i18n="acUpgrade"></button></div>
          <div><button class="btn btn-soft" id="syncBtn" style="width:100%" data-i18n="acSync"></button></div>
        </div>
        <div style="margin-top:8px">
          <label data-i18n="proModelL"></label>
          <select id="proModel"></select>
        </div>
        <div class="checkbox" style="margin-top:10px">
          <input type="checkbox" id="sensToggle">
          <label for="sensToggle" style="margin:0" data-i18n="sensL"></label>
        </div>
        <div style="margin-top:10px"><button class="btn btn-ghost" id="logoutBtn" data-i18n="acLogout"></button></div>
      </div>
      <div class="status" id="acStatus"></div>
    </div>
    <div class="paidnote" id="localNote" style="display:none;background:#fff7ec;border-color:#f2dcb0;color:#8a6d2f" data-i18n="localNote"></div>

    <div id="ownWrap" style="display:none">
      <label data-i18n="engine"></label>
      <select id="provider"></select>
    </div>

    <label id="keyLabel"><span data-i18n="apikey"></span> <a class="hintlink" id="keyLink" target="_blank" data-i18n="getkey"></a></label>
    <div class="row" id="keyRow">
      <div style="flex:3"><input type="password" id="apiKey" placeholder="AIza..." autocomplete="off"></div>
      <div style="flex:1;min-width:150px;display:flex;align-items:flex-end"><button class="btn btn-soft" id="verifyBtn" style="width:100%" data-i18n="verify"></button></div>
    </div>
    <div class="status" id="setupStatus"></div>

    <div class="row" style="margin-top:6px">
      <div>
        <label data-i18n="mode"></label>
        <select id="mode"></select>
      </div>
      <div>
        <label data-i18n="answerlang"></label>
        <select id="ansLang">
          <option value="English">English</option>
          <option value="Italiano">Italiano</option>
          <option value="中文">中文</option>
          <option value="Español">Español</option>
          <option value="same">= speaker</option>
        </select>
      </div>
    </div>

    <!-- Profilo (memoria, M2): superficie UNICA di modifica — sostituisce il
         vecchio campo libero "contesto/CV". BYOK/locale: resta solo su questo
         dispositivo (localStorage). Loggato + consenso: sincronizzato
         sull'account (server UE), con esportazione e cancellazione GDPR. -->
    <div style="margin-top:14px;border-top:1px dashed var(--line);padding-top:8px">
      <label style="font-size:.92rem;color:var(--ink)" data-i18n="profH"></label>
      <p class="sub" data-i18n="profSub"></p>
      <div class="row">
        <div><label data-i18n="profRoleL"></label><input id="pfRole" data-i18n-ph="profRolePh"></div>
        <div><label data-i18n="profCompanyL"></label><input id="pfCompany" data-i18n-ph="profCompanyPh"></div>
      </div>
      <label data-i18n="profCvL"></label>
      <textarea id="pfCv" data-i18n-ph="profCvPh"></textarea>
      <label data-i18n="profStyleL"></label>
      <input id="pfStyle" data-i18n-ph="profStylePh">
      <label data-i18n="profObjL"></label>
      <textarea id="pfObj" data-i18n-ph="profObjPh"></textarea>
      <div class="paidnote" id="profWhere" style="margin-top:10px"></div>
      <div id="profSyncWrap" style="display:none">
        <div class="checkbox">
          <input type="checkbox" id="profConsent">
          <label for="profConsent" style="margin:0" data-i18n="profConsentL"></label>
        </div>
        <div class="row" style="margin-top:10px">
          <div><button class="btn btn-ghost" id="profExportBtn" style="width:100%" data-i18n="profExport"></button></div>
          <div><button class="btn btn-ghost" id="profDeleteBtn" style="width:100%" data-i18n="profDelete"></button></div>
        </div>
        <!-- Storico kit: preferenza + diritti GDPR raggiungibili da qui -->
        <div class="checkbox" style="margin-top:12px">
          <input type="checkbox" id="autoSaveKits">
          <label for="autoSaveKits" style="margin:0" data-i18n="autoSaveL"></label>
        </div>
        <div class="row" style="margin-top:10px">
          <div><a class="btn btn-ghost" href="storico.html" style="display:block;text-align:center;text-decoration:none" data-i18n="histOpen"></a></div>
          <div><button class="btn btn-ghost" id="histExportBtn" style="width:100%" data-i18n="histExport"></button></div>
          <div><button class="btn btn-ghost" id="histDeleteBtn" style="width:100%" data-i18n="histDelete"></button></div>
        </div>
      </div>
      <div class="status" id="profStatus"></div>
    </div>

    <details class="adv">
      <summary data-i18n="adv"></summary>
      <div class="row">
        <div>
          <label data-i18n="model"></label>
          <input id="model" list="modelList" placeholder="model"><datalist id="modelList"></datalist>
        </div>
        <div>
          <label data-i18n="heard"></label>
          <select id="lang">
            <option value="en-US">English (US)</option><option value="en-GB">English (UK)</option>
            <option value="it-IT">Italiano</option><option value="es-ES">Español</option>
            <option value="zh-CN">中文</option><option value="fr-FR">Français</option>
            <option value="de-DE">Deutsch</option><option value="pt-PT">Português</option>
          </select>
        </div>
      </div>
      <div id="baseWrap" style="display:none;margin-top:8px">
        <label data-i18n="baseurl"></label>
        <input id="baseUrl" placeholder="https://...">
      </div>
      <div class="checkbox">
