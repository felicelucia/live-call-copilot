<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Call Copilot — il tuo assistente per le videochiamate</title>
<meta name="theme-color" content="#ff7a59">
<meta name="description" content="The open, private AI copilot for your calls — it listens and suggests what to say, in real time.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Copilot">
<style>
  :root{
    --bg:#fbf7f2; --card:#ffffff; --soft:#fff3ec; --soft2:#eefaf4;
    --ink:#2c2521; --muted:#948a80; --line:#efe6db;
    --accent:#ff7a59; --accent-d:#e85d3a; --teal:#12b886; --amber:#f2a900; --violet:#8b7be8;
    --r:18px; --sh:0 8px 30px rgba(60,40,25,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; line-height:1.55;}
  .wrap{max-width:960px; margin:0 auto; padding:18px 18px 70px; display:flex; flex-direction:column; gap:18px;}

  /* header */
  .top{display:flex; align-items:center; gap:12px;}
  .logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--amber));display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 6px 18px rgba(255,122,89,.35);}
  .top .name{font-weight:800; font-size:1.1rem;}
  .langswitch{margin-left:auto; display:flex; gap:3px; background:#fff; border:1px solid var(--line); border-radius:22px; padding:3px; box-shadow:var(--sh);}
  .langswitch button{background:none;border:none;color:var(--muted);font-size:.8rem;padding:6px 12px;border-radius:18px;cursor:pointer;font-family:inherit;}
  .langswitch button.on{background:var(--accent);color:#fff;font-weight:700;}

  /* hero */
  .hero{background:linear-gradient(160deg,var(--soft),#fff 70%);border:1px solid var(--line);border-radius:var(--r);padding:26px 26px 22px;box-shadow:var(--sh);text-align:center;}
  .hero h1{margin:0 0 8px;font-size:1.7rem;font-weight:800;letter-spacing:-.3px;}
  .hero p{margin:0 auto;max-width:560px;color:#6b625a;font-size:1.02rem;}
  .steps{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
  .step{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:40px;padding:8px 16px;font-size:.86rem;font-weight:600;box-shadow:0 3px 10px rgba(60,40,25,.05);}
  .step .n{width:22px;height:22px;border-radius:50%;background:var(--soft2);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);}
  .card h2{margin:0 0 4px;font-size:1.05rem;font-weight:800;}
  .card .sub{color:var(--muted);font-size:.85rem;margin:0 0 14px;}

  label{display:block;font-size:.8rem;color:#6b625a;font-weight:600;margin:11px 0 5px;}
  input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 13px;font-size:.92rem;font-family:inherit;outline:none;transition:border-color .15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:70px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row>div{flex:1;min-width:150px;}

  button.btn{cursor:pointer;border:none;border-radius:13px;font-size:.95rem;font-weight:700;font-family:inherit;padding:12px 18px;transition:transform .05s,box-shadow .15s,filter .15s;}
  button.btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(255,122,89,.32);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-soft{background:var(--soft);color:var(--accent-d);border:1.5px solid #ffd9cb;}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .btn-listen{background:var(--teal);color:#fff;font-size:1.05rem;padding:15px 30px;box-shadow:0 8px 20px rgba(18,184,134,.32);}
  .btn-listen.on{background:var(--accent-d);animation:pulse 1.5s infinite;}
  .btn-toggle{background:#fff;color:var(--muted);border:1.5px solid var(--line);}
  .btn-toggle.on{background:var(--soft2);color:var(--teal);border-color:#b8ecd8;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  @keyframes pulse{50%{filter:brightness(1.12);}}

  /* choice cards for onboarding */
  .choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:900px){.choices{grid-template-columns:1fr 1fr;}}
  @media(max-width:640px){.choices{grid-template-columns:1fr;}}
  .choice.pro{border-color:#ddd6fa;}
  .choice.pro:hover{border-color:var(--violet);}
  .choice.pro.sel{border-color:var(--violet);background:#f4f1ff;}
  .badge.vio{background:var(--violet);}
  /* pill di trasparenza sul routing (AI Act): chi ha risposto e perché */
  .routing{display:none;align-items:flex-start;gap:7px;background:#f4f1ff;border:1px solid #ddd6fa;border-radius:11px;padding:7px 11px;margin-bottom:9px;font-size:.78rem;color:#5b4fb8;line-height:1.4;}
  .routing.show{display:flex;}
  .routing b{color:#3f339b;}
  .routing .rx{flex:0 0 auto;}
  .choice{border:2px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s;}
  .choice:hover{border-color:#ffcdbc;}
  .choice.sel{border-color:var(--accent);background:var(--soft);}
  .choice .t{font-weight:800;font-size:.98rem;display:flex;align-items:center;gap:8px;}
  .choice .d{color:var(--muted);font-size:.82rem;margin-top:4px;}
  .badge{font-size:.68rem;font-weight:800;background:var(--teal);color:#fff;border-radius:20px;padding:2px 8px;}

  .status{font-size:.82rem;color:var(--muted);min-height:1.05em;margin-top:8px;}
  .status.ok{color:var(--teal);} .status.err{color:var(--accent-d);} .status.work{color:var(--amber);}
  .hintlink{font-size:.78rem;color:var(--accent-d);text-decoration:none;font-weight:600;}
  .checkbox{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.82rem;color:var(--muted);}
  .checkbox input{width:auto;}

  details.adv{margin-top:14px;border-top:1px dashed var(--line);padding-top:6px;}
  details.adv>summary{list-style:none;cursor:pointer;padding:10px 0;font-size:.85rem;color:var(--muted);font-weight:600;}
  details.adv>summary::-webkit-details-marker{display:none;}

  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;}
  .live-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:14px;}
  @media(max-width:820px){.live-grid{grid-template-columns:1fr;}}
  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;min-height:200px;box-shadow:var(--sh);}
  .box .bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
  .box .bh h3{margin:0;font-size:.9rem;font-weight:800;}
  .dot{width:9px;height:9px;border-radius:50%;background:#d9cec3;display:inline-block;margin-right:7px;}
  .dot.live{background:var(--accent-d);box-shadow:0 0 8px var(--accent-d);animation:pulse 1.4s infinite;}
  .transcript{flex:1;overflow-y:auto;max-height:280px;font-size:.95rem;color:#4a423b;}
  .transcript .interim{color:var(--muted);font-style:italic;}
  .transcript:empty::before{content:attr(data-ph);color:#b8ab9e;font-size:.85rem;}
  .answer{flex:1;overflow-y:auto;max-height:440px;white-space:pre-wrap;font-size:1.06rem;color:#3a332e;}
  .answer:empty::before{content:attr(data-ph);color:#b8ab9e;font-size:.85rem;}
  .answer b{color:var(--teal);}
  .mini{font-size:.74rem;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 10px;cursor:pointer;}
  a{color:var(--accent-d);}
  .foot{font-size:.78rem;color:var(--muted);}
  .paidnote{background:var(--soft2);border:1px solid #cdeede;border-radius:12px;padding:11px 14px;font-size:.82rem;color:#2f7a5e;margin-top:12px;}

  /* settings: schermata alternativa alla Live (niente overlay, niente drawer) */
  .setbtn{margin-left:auto;padding:9px 14px;}
  .langswitch{margin-left:0;}
  .privacy-chip{display:inline-flex;align-items:center;gap:7px;margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:7px 15px;font-size:.82rem;color:#3f6a58;font-weight:600;box-shadow:0 3px 10px rgba(60,40,25,.05);}
  .consent{text-align:center;font-size:.78rem;color:var(--muted);margin-top:2px;}
  .consent b{color:var(--accent-d);font-weight:700;}
  .view{display:flex;flex-direction:column;gap:18px;animation:viewin .22s ease;}
  @keyframes viewin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .set-head{display:flex;align-items:center;gap:14px;}
  .set-head h2{margin:0;font-size:1.15rem;font-weight:800;}
  .caps{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}
  .caps h3{margin:0 0 8px;font-size:1rem;font-weight:800;}
  .caps .capsbody{font-size:.86rem;color:#5f564e;line-height:1.62;}
  .caps .capsbody b{color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="logo">🎧</div>
    <div class="name">Live Call Copilot</div>
    <button class="btn btn-ghost setbtn" id="settingsBtn"><span data-i18n="settings"></span></button>
    <div class="langswitch" id="langswitch">
      <button data-lang="it" class="on">IT</button>
      <button data-lang="en">EN</button>
      <button data-lang="zh">中文</button>
      <button data-lang="es">ES</button>
    </div>
  </div>

  <!-- ═══ VISTA LIVE (principale) ═══ -->
  <div class="view" id="viewLive">

  <!-- HERO -->
  <div class="hero">
    <h1 data-i18n="heroH"></h1>
    <p data-i18n="heroP"></p>
    <div class="steps">
      <div class="step"><span class="n">1</span><span data-i18n="s1"></span></div>
      <div class="step"><span class="n">2</span><span data-i18n="s2"></span></div>
      <div class="step"><span class="n">3</span><span data-i18n="s3"></span></div>
    </div>
    <div class="privacy-chip" data-i18n="privacyChip"></div>
  </div>

  <!-- LIVE (front and center) -->
  <div class="controls">
    <button class="btn btn-listen" id="listenBtn"><span data-i18n="listen"></span></button>
    <button class="btn btn-toggle on" id="autoBtn"><span data-i18n="auto"></span></button>
    <button class="btn btn-primary" id="suggestBtn" disabled data-i18n="suggest"></button>
    <button class="btn btn-ghost" id="floatBtn" data-i18n="float"></button>
    <button class="btn btn-ghost" id="clearBtn" data-i18n="clear"></button>
    <button class="btn btn-soft" id="installBtn" style="display:none" data-i18n="install"></button>
  </div>
  <div class="consent" data-i18n="consentLine"></div>
  <div class="status" id="liveStatus" style="text-align:center"></div>

  <div class="live-grid" id="liveHome">
    <div class="box">
      <div class="bh"><h3><span class="dot" id="recDot"></span><span data-i18n="listening"></span></h3></div>
      <div class="transcript" id="transcript" data-ph="—"></div>
      <div style="margin-top:9px"><input type="text" id="manualQ" data-i18n-ph="manualph"></div>
    </div>
    <div class="box" id="answerBox">
      <div class="bh"><h3>💬 <span data-i18n="answer"></span></h3><button class="mini" id="copyBtn" data-i18n="copy"></button></div>
      <div class="routing" id="routingInfo"><span class="rx">⚡</span><span id="routingText"></span></div>
      <div class="answer" id="answer" data-ph="—"></div>
    </div>
  </div>

  </div><!-- /viewLive -->

  <!-- ═══ VISTA IMPOSTAZIONI (sostituisce la Live, non le va sopra) ═══ -->
  <div class="view" id="viewSettings" style="display:none">

  <div class="set-head">
    <button class="btn btn-ghost" id="backBtn" data-i18n="doneBack"></button>
    <h2 data-i18n="drawerH"></h2>
  </div>

  <div class="card" id="setupCard">
    <h2 data-i18n="startH"></h2>
    <p class="sub" data-i18n="startSub"></p>

    <div class="choices">
      <div class="choice sel" id="choiceFree">
        <div class="t">🆓 <span data-i18n="freeT"></span> <span class="badge" data-i18n="reco"></span></div>
        <div class="d" data-i18n="freeD"></div>
      </div>
      <div class="choice" id="choiceOwn">
        <div class="t">🔑 <span data-i18n="ownT"></span></div>
        <div class="d" data-i18n="ownD"></div>
      </div>
      <div class="choice" id="choiceLocal">
        <div class="t">🔒 <span data-i18n="localT"></span></div>
        <div class="d" data-i18n="localD"></div>
      </div>
      <div class="choice pro" id="choicePro">
        <div class="t">⭐ <span data-i18n="proT"></span> <span class="badge vio" data-i18n="proBadge"></span></div>
        <div class="d" data-i18n="proD"></div>
      </div>
    </div>

    <!-- Account / piano Pro (nostro cloud) -->
    <div id="proWrap" style="display:none">
      <div id="proLoggedOut">
        <div class="row">
          <div><label data-i18n="acEmailL"></label><input type="email" id="acEmail" autocomplete="email" placeholder="nome@email.it"></div>
          <div><label data-i18n="acPassL"></label><input type="password" id="acPass" autocomplete="current-password" placeholder="········"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div><button class="btn btn-primary" id="loginBtn" style="width:100%" data-i18n="acLogin"></button></div>
          <div><button class="btn btn-ghost" id="signupBtn" style="width:100%" data-i18n="acSignup"></button></div>
        </div>
      </div>
      <div id="proLoggedIn" style="display:none">
        <div class="paidnote" id="proPlanNote"></div>
        <div class="row" id="proUpgradeRow" style="display:none;margin-top:8px">
          <div><button class="btn btn-primary" id="upgradeBtn" style="width:100%" data-i18n="acUpgrade"></button></div>
          <div><button class="btn btn-soft" id="syncBtn" style="width:100%" data-i18n="acSync"></button></div>
        </div>
        <div style="margin-top:8px">
          <label data-i18n="proModelL"></label>
          <select id="proModel"></select>
        </div>
        <div class="checkbox" style="margin-top:10px">
          <input type="checkbox" id="sensToggle">
          <label for="sensToggle" style="margin:0" data-i18n="sensL"></label>
        </div>
        <div style="margin-top:10px"><button class="btn btn-ghost" id="logoutBtn" data-i18n="acLogout"></button></div>
      </div>
      <div class="status" id="acStatus"></div>
    </div>
    <div class="paidnote" id="localNote" style="display:none;background:#fff7ec;border-color:#f2dcb0;color:#8a6d2f" data-i18n="localNote"></div>

    <div id="ownWrap" style="display:none">
      <label data-i18n="engine"></label>
      <select id="provider"></select>
    </div>

    <label id="keyLabel"><span data-i18n="apikey"></span> <a class="hintlink" id="keyLink" target="_blank" data-i18n="getkey"></a></label>
    <div class="row" id="keyRow">
      <div style="flex:3"><input type="password" id="apiKey" placeholder="AIza..." autocomplete="off"></div>
      <div style="flex:1;min-width:150px;display:flex;align-items:flex-end"><button class="btn btn-soft" id="verifyBtn" style="width:100%" data-i18n="verify"></button></div>
    </div>
    <div class="status" id="setupStatus"></div>

    <div class="row" style="margin-top:6px">
      <div>
        <label data-i18n="mode"></label>
        <select id="mode"></select>
      </div>
      <div>
        <label data-i18n="answerlang"></label>
        <select id="ansLang">
          <option value="English">English</option>
          <option value="Italiano">Italiano</option>
          <option value="中文">中文</option>
          <option value="Español">Español</option>
          <option value="same">= speaker</option>
        </select>
      </div>
    </div>

    <!-- Profilo (memoria, M2): superficie UNICA di modifica — sostituisce il
         vecchio campo libero "contesto/CV". BYOK/locale: resta solo su questo
         dispositivo (localStorage). Loggato + consenso: sincronizzato
         sull'account (server UE), con esportazione e cancellazione GDPR. -->
    <div style="margin-top:14px;border-top:1px dashed var(--line);padding-top:8px">
      <label style="font-size:.92rem;color:var(--ink)" data-i18n="profH"></label>
      <p class="sub" data-i18n="profSub"></p>
      <div class="row">
        <div><label data-i18n="profRoleL"></label><input id="pfRole" data-i18n-ph="profRolePh"></div>
        <div><label data-i18n="profCompanyL"></label><input id="pfCompany" data-i18n-ph="profCompanyPh"></div>
      </div>
      <label data-i18n="profCvL"></label>
      <textarea id="pfCv" data-i18n-ph="profCvPh"></textarea>
      <label data-i18n="profStyleL"></label>
      <input id="pfStyle" data-i18n-ph="profStylePh">
      <label data-i18n="profObjL"></label>
      <textarea id="pfObj" data-i18n-ph="profObjPh"></textarea>
      <div class="paidnote" id="profWhere" style="margin-top:10px"></div>
      <div id="profSyncWrap" style="display:none">
        <div class="checkbox">
          <input type="checkbox" id="profConsent">
          <label for="profConsent" style="margin:0" data-i18n="profConsentL"></label>
        </div>
        <div class="row" style="margin-top:10px">
          <div><button class="btn btn-ghost" id="profExportBtn" style="width:100%" data-i18n="profExport"></button></div>
          <div><button class="btn btn-ghost" id="profDeleteBtn" style="width:100%" data-i18n="profDelete"></button></div>
        </div>
      </div>
      <div class="status" id="profStatus"></div>
    </div>

    <details class="adv">
      <summary data-i18n="adv"></summary>
      <div class="row">
        <div>
          <label data-i18n="model"></label>
          <input id="model" list="modelList" placeholder="model"><datalist id="modelList"></datalist>
        </div>
        <div>
          <label data-i18n="heard"></label>
          <select id="lang">
            <option value="en-US">English (US)</option><option value="en-GB">English (UK)</option>
            <option value="it-IT">Italiano</option><option value="es-ES">Español</option>
            <option value="zh-CN">中文</option><option value="fr-FR">Français</option>
            <option value="de-DE">Deutsch</option><option value="pt-PT">Português</option>
          </select>
        </div>
      </div>
      <div id="baseWrap" style="display:none;margin-top:8px">
        <label data-i18n="baseurl"></label>
        <input id="baseUrl" placeholder="https://...">
      </div>
      <div class="checkbox">
        <input type="checkbox" id="remember" checked>
        <label for="remember" style="margin:0" data-i18n="remember"></label>
        <a href="#" id="forget" class="hintlink" data-i18n="forget"></a>
      </div>
    </details>

    <div class="paidnote" data-i18n="paid"></div>
  </div>

  <div class="caps">
    <h3 data-i18n="capsTitle"></h3>
    <div class="capsbody" data-i18n="capsBody"></div>
  </div>

  <details class="card">
    <summary style="cursor:pointer;font-weight:800;list-style:none" data-i18n="howto"></summary>
    <div class="foot" id="howtoBody" style="margin-top:10px"></div>
  </details>

  </div><!-- /viewSettings -->
</div><!-- /wrap -->

<script>
/* ═══ URL del backend (piano Pro) ═══
   Se la pagina è servita via http(s) (dal backend stesso, da un tunnel o dal
   deploy) usa la STESSA origine — così funziona ovunque senza toccare nulla.
   Il fallback su localhost serve solo quando si apre il file in locale (file://). */
const BACKEND_URL = location.protocol.startsWith('http') ? location.origin : 'http://127.0.0.1:8787';

(function(){
  const $=id=>document.getElementById(id);
  const T={
    it:{heroH:"Il tuo assistente per le videochiamate",heroP:"Ascolta la conversazione (colloquio, riunione, vendita…) e ti suggerisce cosa rispondere, in tempo reale. Con la tua chiave AI gratuita, tutto dentro il browser.",s1:"Scegli come funziona",s2:"Premi Ascolta",s3:"Leggi la risposta",

  const MODES={
    interview:{it:'Colloquio di lavoro',en:'Job interview',zh:'求职面试',es:'Entrevista de trabajo',p:"You are the copilot of a CANDIDATE in a job interview. Detect the interviewer's LAST question and craft a spoken, first-person answer, confident, concise (4-7 sentences), grounded in the candidate context. Use STAR for behavioral questions."},
    sales:{it:'Vendite',en:'Sales call',zh:'销售通话',es:'Llamada de ventas',p:"You are the copilot of a SALESPERSON. Detect the prospect's last point/objection and suggest a persuasive, empathetic first-person reply handling objections, showing value, moving to next steps."},

    meeting:{it:'Riunione',en:'Meeting',zh:'会议',es:'Reunión',p:"You are a meeting copilot. Detect the last question/point and suggest a clear, professional first-person response."},

    study:{it:'Studio / esame',en:'Study / exam',zh:'学习/考试',es:'Estudio / examen',p:"You are a study copilot. Detect the examiner's question and give a correct, well-structured spoken answer."},
    custom:{it:'Personalizzato',en:'Custom',zh:'自定义',es:'Personalizado',p:"__custom__"}

  const modeEl=$('mode');
  function buildModeOptions(){const cur=modeEl.value||'interview';modeEl.innerHTML='';Object.keys(MODES).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=MODES[k][LANG]||MODES[k].it;modeEl.appendChild(o);});modeEl.value=cur;}

  const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}} ,del(k){try{localStorage.removeItem(k)}catch(_){}}};
  const KEYS=['v5_lang','v5_prov','v5_mode','v5_heard','v5_ans','v5_ctx','v5_auto','v5_remember','v6_pro','v6_promodel','v7_role','v7_company','v7_cv','v7_style','v7_obj'];
  // Profilo strutturato: id campo → chiave localStorage (v5_ctx resta solo per migrare il vecchio campo libero)
  const PF_KEYS={pfRole:'v7_role',pfCompany:'v7_company',pfCv:'v7_cv',pfStyle:'v7_style',pfObj:'v7_obj'};
  const PF_IDS=Object.keys(PF_KEYS);
  const keyName=()=>'v5_key_'+providerEl.value;
  function save(){
    if(!$('remember').checked){KEYS.forEach(store.del);PKEYS.forEach(p=>{store.del('v5_key_'+p);store.del('v5_model_'+p);store.del('v5_base_'+p);});store.set('v5_remember','0');return;}
    store.set('v5_remember','1');store.set('v5_lang',LANG);store.set('v5_prov',providerEl.value);store.set('v5_mode',modeEl.value);store.set('v6_pro',proMode?'1':'0');
    store.set('v5_heard',$('lang').value);store.set('v5_ans',$('ansLang').value);store.set('v5_auto',autoMode?'1':'0');
    PF_IDS.forEach(id=>store.set(PF_KEYS[id],$(id).value));
    if($('model').value)store.set('v5_model_'+providerEl.value,$('model').value);
    if($('baseUrl').value)store.set('v5_base_'+providerEl.value,$('baseUrl').value);
    if($('apiKey').value.trim())store.set(keyName(),$('apiKey').value.trim());
  }

  let finalText='',recognizing=false,recognition=null,autoMode=true,busy=false,pauseTimer=null,lastLen=0,lastAnswer='';
  const setupStatus=$('setupStatus'),liveStatus=$('liveStatus'),transcriptEl=$('transcript'),answerEl=$('answer');
  const listenBtn=$('listenBtn'),autoBtn=$('autoBtn'),suggestBtn=$('suggestBtn'),recDot=$('recDot');
  function setS(el,msg,cls){el.textContent=msg;el.className='status '+(cls||'');}

  /* onboarding choice */
  let proMode=false;
  function selChoice(which){ ['choiceFree','choiceOwn','choiceLocal','choicePro'].forEach(c=>$(c).classList.toggle('sel',c===which)); }
  $('choiceFree').addEventListener('click',()=>{ proMode=false; providerEl.value='gemini'; selChoice('choiceFree'); $('ownWrap').style.display='none'; syncProvider(); save(); });
  $('choiceOwn').addEventListener('click',()=>{ proMode=false; if(providerEl.value==='gemini'||providerEl.value==='ollama')providerEl.value='openai'; selChoice('choiceOwn'); $('ownWrap').style.display=''; syncProvider(); save(); });
  $('choiceLocal').addEventListener('click',()=>{ proMode=false; providerEl.value='ollama'; selChoice('choiceLocal'); $('ownWrap').style.display='none'; syncProvider(); save(); });
  $('choicePro').addEventListener('click',()=>{ proMode=true; selChoice('choicePro'); $('ownWrap').style.display='none'; syncProvider(); refreshMe(); save(); });
  providerEl.addEventListener('change',()=>{syncProvider();save();});

  function syncProvider(){
    const p=curProv(); const local=!!p.local&&!proMode;
    $('proWrap').style.display=proMode?'':'none';
    $('keyLabel').style.display=proMode?'none':'';
    $('keyRow').style.display=proMode?'none':'';
    $('localNote').style.display=(local)?'':'none';
    if(proMode){ $('baseWrap').style.display='none'; suggestBtn.disabled=!meUser; setS(setupStatus,'',''); return; }
    $('keyLink').href=p.keyUrl||'#'; $('apiKey').placeholder=local?'(nessuna chiave — locale)':(p.hint||'API key');
    $('apiKey').disabled=local;
    $('baseWrap').style.display=(providerEl.value==='custom'||local)?'':'none';
    const dl=$('modelList');dl.innerHTML='';(p.models||[]).forEach(m=>{const o=document.createElement('option');o.value=m;dl.appendChild(o);});
    $('apiKey').value=local?'':(store.get(keyName())||'');
    $('model').value=store.get('v5_model_'+providerEl.value)||(p.models&&p.models[0])||'';
    $('baseUrl').value=store.get('v5_base_'+providerEl.value)||(p.base||'');
    suggestBtn.disabled = local? false : !$('apiKey').value.trim(); setS(setupStatus,'','');
  }

  /* ---- Account & piano Pro (nostro backend) ---- */
  let meUser=null, mePlan=null;
  const api=(path,opts={})=>fetch(BACKEND_URL+path,Object.assign({credentials:'include',headers:{'Content-Type':'application/json'}},opts));
  function setAc(msg,cls){const el=$('acStatus');el.textContent=msg;el.className='status '+(cls||'');}
  function renderAccount(d){
    const inEl=$('proLoggedIn'),outEl=$('proLoggedOut');
    if(!d){ inEl.style.display='none'; outEl.style.display=''; if(proMode)suggestBtn.disabled=true; return; }
    outEl.style.display='none'; inEl.style.display='';
    const pro=d.plan!=='free';
    $('proPlanNote').textContent=t('acHello')+' '+d.user.name+' ('+d.user.email+') — '+t('acPlan')+': '+d.plan.toUpperCase()+' · '+d.limits.requestsPerMinute+' '+t('acRpm')+(pro?'':' — '+t('acFree'));
    $('proUpgradeRow').style.display=pro?'none':'';
    if(proMode)suggestBtn.disabled=false;
  }
  async function refreshMe(){
    try{
      const r=await api('/v1/me');
      if(r.status===401){meUser=null;mePlan=null;renderAccount(null);renderProfileWhere();return;}
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=await r.json(); meUser=d.user; mePlan=d.plan; renderAccount(d); loadProModels(); pullProfile();
    }catch(_){ meUser=null;mePlan=null;renderAccount(null); renderProfileWhere(); if(proMode)setAc(t('acBackendDown'),'err'); }
  }
  async function loadProModels(){
    try{
      const r=await api('/v1/models'); const d=await r.json();
      const sel=$('proModel'); const saved=store.get('v6_promodel'); sel.innerHTML='';
      // Prima scelta: routing automatico (M2) — il backend sceglie e spiega perché.
      const auto=document.createElement('option'); auto.value='auto'; auto.textContent=t('autoOpt'); sel.appendChild(auto);
      d.models.filter(m=>m.available).forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.label;sel.appendChild(o);});
      sel.value=(saved && [...sel.options].some(o=>o.value===saved))? saved : 'auto';
    }catch(_){}
  }
  $('sensToggle').addEventListener('change',()=>store.set('v6_sens',$('sensToggle').checked?'1':'0'));
  async function authCall(path){
    const email=$('acEmail').value.trim(), password=$('acPass').value;
    if(!email||!password){setAc(t('acNeedFields'),'err');return;}
    setAc(t('acWorking'),'work');
    try{
      const body=path.indexOf('sign-up')>=0? {name:email.split('@')[0],email,password} : {email,password};
      const r=await api(path,{method:'POST',body:JSON.stringify(body)});
      if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||('HTTP '+r.status));}
      setAc('✔','ok'); $('acPass').value=''; await refreshMe();
    }catch(e){setAc(e.message,'err');}
  }
  $('loginBtn').addEventListener('click',()=>authCall('/api/auth/sign-in/email'));
  $('signupBtn').addEventListener('click',()=>authCall('/api/auth/sign-up/email'));
  $('logoutBtn').addEventListener('click',async()=>{
    try{await api('/api/auth/sign-out',{method:'POST',body:'{}'});}catch(_){}
    await refreshMe();
  });
  $('upgradeBtn').addEventListener('click',async()=>{
    setAc(t('acWorking'),'work');
    try{
      const r=await api('/v1/billing/checkout',{method:'POST',body:'{}'});
      const d=await r.json(); if(!r.ok||!d.url)throw new Error(d.error||'checkout');
      window.open(d.url,'_blank'); setAc(t('acPaid'),'work');
    }catch(e){setAc(e.message,'err');}
  });
  $('syncBtn').addEventListener('click',async()=>{
    setAc(t('acWorking'),'work');
    try{ await api('/v1/billing/sync',{method:'POST',body:'{}'}); setAc('✔','ok'); await refreshMe(); }
    catch(e){setAc(e.message,'err');}
  });
  $('proModel').addEventListener('change',()=>store.set('v6_promodel',$('proModel').value));

  /* ---- Profilo (memoria persistente, M2) ----
     Sempre salvato in locale. Se l'utente è loggato E ha dato il consenso,
     viene anche sincronizzato sull'account (server UE). La revoca del
     consenso cancella la copia sul server; "Cancella il profilo" cancella
     ovunque (server + questo dispositivo). */
  function profileText(){
    const v=id=>$(id).value.trim(); const parts=[];
    if(v('pfRole'))parts.push('Role: '+v('pfRole'));
    if(v('pfCompany'))parts.push('Company/product: '+v('pfCompany'));
    if(v('pfCv'))parts.push('CV/experience: '+v('pfCv'));
    if(v('pfStyle'))parts.push('Preferred answering style: '+v('pfStyle'));
    if(v('pfObj'))parts.push('Recurring objections/questions to be ready for: '+v('pfObj'));
    return parts.join('\n');
  }
  function setPf(msg,cls){const el=$('profStatus');el.textContent=msg;el.className='status '+(cls||'');}
  function renderProfileWhere(){
    const synced=!!meUser&&$('profConsent').checked;
    $('profWhere').textContent=synced?t('profStoredAccount'):t('profStoredDevice');
    $('profSyncWrap').style.display=meUser?'':'none';
  }
  async function pushProfile(){
    if(!meUser||!$('profConsent').checked)return;
    try{
      const body={consent:true,role:$('pfRole').value.trim(),company:$('pfCompany').value.trim(),cv:$('pfCv').value.trim(),style:$('pfStyle').value.trim(),objections:$('pfObj').value.trim()};
      const r=await api('/v1/profile',{method:'PUT',body:JSON.stringify(body)});
      if(!r.ok)throw new Error('HTTP '+r.status);
      setPf(t('profSynced'),'ok');
    }catch(e){setPf('Sync: '+e.message,'err');}
  }
  async function pullProfile(){
    if(!meUser){renderProfileWhere();return;}
    try{
      const r=await api('/v1/profile');
      if(r.ok){
        const d=await r.json();
        if(d.exists){ // il server vince: è la copia condivisa tra i dispositivi
          const p=d.profile;
          $('pfRole').value=p.role||'';$('pfCompany').value=p.company||'';$('pfCv').value=p.cv||'';$('pfStyle').value=p.style||'';$('pfObj').value=p.objections||'';
          $('profConsent').checked=true; save();
        }else{ $('profConsent').checked=false; }
      }
    }catch(_){}
    renderProfileWhere();
  }
  $('profConsent').addEventListener('change',async()=>{
    if(!meUser){renderProfileWhere();return;}
    if($('profConsent').checked){ await pushProfile(); }
    else{
      try{ await api('/v1/profile',{method:'DELETE',body:'{}'}); setPf(t('profServerOff'),'ok'); }
      catch(e){ setPf(e.message,'err'); }
    }
    renderProfileWhere();
  });
  $('profExportBtn').addEventListener('click',()=>window.open(BACKEND_URL+'/v1/profile/export','_blank'));
  $('profDeleteBtn').addEventListener('click',async()=>{
    if(!confirm(t('profDeleteConfirm')))return;
    try{ await api('/v1/profile',{method:'DELETE',body:'{}'}); }catch(_){}
    PF_IDS.forEach(id=>{$(id).value='';store.del(PF_KEYS[id]);});
    $('profConsent').checked=false; renderProfileWhere(); setPf(t('profDeleted'),'ok');
  });
  PF_IDS.forEach(id=>$(id).addEventListener('change',()=>{save();pushProfile();}));

  $('verifyBtn').addEventListener('click',async()=>{
    const p=curProv(),key=$('apiKey').value.trim();
    if(p.local){
      setS(setupStatus,t('thinking'),'work');
      try{
        const base=($('baseUrl').value.trim()||p.base).replace(/\/v1$/,'');
        const r=await fetch(base+'/api/tags'); const d=await r.json();
        const ms=(d.models||[]).map(m=>m.name); const dl=$('modelList');dl.innerHTML='';ms.forEach(m=>{const o=document.createElement('option');o.value=m;dl.appendChild(o);});
        if(ms.length&&!$('model').value)$('model').value=ms[0];
        setS(setupStatus,'✔ Ollama '+(ms.length?('— '+ms.length+' modelli'):'raggiunto'),'ok');save();
      }catch(e){ setS(setupStatus,'Ollama non raggiungibile. Apri questo file in locale e avvia Ollama con OLLAMA_ORIGINS=* (vedi nota).','err'); }
      return;
    }
    if(!key){setS(setupStatus,t('nokey'),'err');return;}
    if(p.gemini){
      setS(setupStatus,t('thinking'),'work');
      try{
        const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key));
        const d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||('HTTP '+r.status));
        const ms=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).filter(m=>/gemini/i.test(m.name)&&!/embedding|aqa|imagen/i.test(m.name)).map(m=>m.name.replace('models/',''));
        const dl=$('modelList');dl.innerHTML='';ms.forEach(m=>{const o=document.createElement('option');o.value=m;dl.appendChild(o);});
        const pick=ms.find(n=>/flash/i.test(n)&&/latest/i.test(n))||ms.find(n=>/flash/i.test(n)&&!/2\.5|2\.0|1\.5/.test(n))||ms.find(n=>/flash/i.test(n))||ms[0];
        if(pick)$('model').value=pick; setS(setupStatus,t('valid'),'ok');save();
      }catch(e){setS(setupStatus,'Error: '+e.message,'err');}
    }else{setS(setupStatus,t('valid'),'ok');save();}
  });

  function canRun(){ return proMode? !!meUser : ($('apiKey').value.trim()||curProv().local); }
  function cantRunMsg(){ return proMode? t('acNeedLogin') : t('nokey'); }

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  function startRec(){
    if(!canRun()){ setS(liveStatus,cantRunMsg(),'err'); showSettings(); return; }
    if(!SR){setS(liveStatus,'Chrome required for speech.','err');return;}
    autoMode=true; autoBtn.classList.add('on');
    recognition=new SR();recognition.lang=$('lang').value;recognition.continuous=true;recognition.interimResults=true;
    recognition.onresult=e=>{let itr='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=x+' ';else itr+=x;}render(itr);if(autoMode)sched();};
    recognition.onerror=e=>setS(liveStatus,'Mic: '+e.error,'err');
    recognition.onend=()=>{if(recognizing){try{recognition.start()}catch(_){}}};
    try{recognition.start();recognizing=true;listenBtn.classList.add('on');listenBtn.querySelector('span').textContent=t('stop');recDot.classList.add('live');setS(liveStatus,t('onair'),'ok');}catch(_){}
  }
  function stopRec(){recognizing=false;if(recognition)recognition.stop();if(pauseTimer)clearTimeout(pauseTimer);listenBtn.classList.remove('on');listenBtn.querySelector('span').textContent=t('listen');recDot.classList.remove('live');setS(liveStatus,t('stopped'));}
  function render(itr){transcriptEl.innerHTML=finalText+'<span class="interim">'+(itr||'')+'</span>';transcriptEl.scrollTop=transcriptEl.scrollHeight;}
  function sched(){if(pauseTimer)clearTimeout(pauseTimer);pauseTimer=setTimeout(()=>{if(!busy&&finalText.length-lastLen>14){lastLen=finalText.length;suggest();}},1000);}
  listenBtn.addEventListener('click',()=>recognizing?stopRec():startRec());
  autoBtn.addEventListener('click',()=>{autoMode=!autoMode;autoBtn.classList.toggle('on',autoMode);setS(liveStatus,autoMode?t('autoOn'):t('autoOff'),autoMode?'ok':'');save();});
  $('clearBtn').addEventListener('click',()=>{finalText='';lastLen=0;render('');answerEl.innerHTML='';lastAnswer='';});

  function systemPrompt(){
    const m=MODES[modeEl.value]||MODES.interview; const ans=$('ansLang').value;
    if(m.p==='__translate__'){ const target=ans==='same'?'Italian':ans; return "You are a live interpreter. Translate the following speech into "+target+". Output ONLY the translation, nothing else. If partial, translate what you have."; }
    let base=m.p==='__custom__'?(profileText()?'Follow the user context as instructions.':'You are a helpful real-time call copilot.'):m.p;
    const ansInstr=ans==='same'?'Answer in the SAME language the speaker used.':('Write the suggested answer in '+ans+'.');
    // Trascrizione desktop: entrambi i lati etichettati. Il suggerimento deve
    // rispondere all'ULTIMA battuta dell'interlocutore, mai alle battute "Io:".
    const labeled=/(^|\n)Interlocutore:/.test(finalText);
    const labeledInstr=labeled?" The transcript has BOTH sides labeled: lines starting with 'Io:' are what the USER already said; lines starting with 'Interlocutore:' are the other party. Respond ONLY to the LAST 'Interlocutore:' line — never answer or rephrase the user's own 'Io:' lines.":"";
    return base+"\n\nPerson/context (first person): "+(profileText()||'(none)')+"\n\nYou get a live transcript of the other party. Focus on the LAST question/point."+labeledInstr+" "+ansInstr+" Natural, spoken, concise. Begin with a one-line note of the detected question, then the answer.";
  }

  async function errMsg(res){let m='HTTP '+res.status;try{const d=await res.json();m=(d.error&&(d.error.message||d.error))||JSON.stringify(d);}catch(_){}return m;}
  async function readSSE(res,onLine){const rd=res.body.getReader(),dec=new TextDecoder();let buf='';while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){let ln=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!ln.startsWith('data:'))continue;ln=ln.slice(5).trim();if(!ln||ln==='[DONE]')continue;onLine(ln);}}}
  /* Modalità Pro: la richiesta va al NOSTRO backend (chiave universale lato
     server, cookie di sessione). Formato SSE: {type:"delta"|"done"|"error"}. */
  function backendMode(){ const m=modeEl.value; return (m==='interview'||m==='sales'||m==='meeting')?m:'general'; }
  function showRouting(j){
    $('routingText').innerHTML=t('routedBy')+' <b>'+(j.label||j.model)+'</b> — '+String(j.reason||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    $('routingInfo').classList.add('show');
  }
  function clearRouting(){ $('routingInfo').classList.remove('show'); $('routingText').textContent=''; }

  async function callProStream(onDelta){
    const q=finalText.trim().slice(-2000);
    const sens=$('sensToggle').checked?'high':'low';
    const res=await fetch(BACKEND_URL+'/v1/complete',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:($('proModel').value||'auto'),sensitivity:sens,mode:backendMode(),tier:'cloud',system:systemPrompt(),messages:[{role:'user',content:'Transcript:\n'+q}],maxTokens:800})});
    if(!res.ok){const d=await res.json().catch(()=>({}));throw new Error(d.detail||d.error||('HTTP '+res.status));}
    let apiErr=null;
    await readSSE(res,ln=>{try{const j=JSON.parse(ln);if(j.type==='routing')showRouting(j);else if(j.type==='delta'&&j.text)onDelta(j.text);else if(j.type==='error')apiErr=j.message||'errore dal backend';}catch(_){}});
    if(apiErr)throw new Error(apiErr);
  }

  async function callStream(onDelta){
    if(proMode) return callProStream(onDelta);
    const p=curProv(),key=$('apiKey').value.trim(),model=$('model').value.trim(),q=finalText.trim().slice(-2000),sys=systemPrompt();
    try{
      if(p.kind==='gemini'){
        const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':streamGenerateContent?alt=sse&key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:'Transcript:\n'+q}]}],generationConfig:{temperature:0.6,maxOutputTokens:800}})});
        if(!res.ok)throw new Error(await errMsg(res));
        await readSSE(res,ln=>{try{const j=JSON.parse(ln);const parts=(((j.candidates||[])[0]||{}).content||{}).parts||[];const tx=parts.map(x=>x.text||'').join('');if(tx)onDelta(tx);}catch(_){}});return;
      }
      if(p.kind==='anthropic'){
        const base=$('baseUrl').value.trim()||p.base;
        const res=await fetch(base+'/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:800,system:sys,messages:[{role:'user',content:'Transcript:\n'+q}],stream:true})});
        if(!res.ok)throw new Error(await errMsg(res));
        await readSSE(res,ln=>{try{const j=JSON.parse(ln);if(j.type==='content_block_delta'&&j.delta&&j.delta.text)onDelta(j.delta.text);}catch(_){}});return;
      }
      const base=$('baseUrl').value.trim()||p.base;
      const hd={'Content-Type':'application/json'}; if(key) hd['Authorization']='Bearer '+key;
      const res=await fetch(base+'/chat/completions',{method:'POST',headers:hd,body:JSON.stringify({model,stream:true,temperature:0.6,max_tokens:800,messages:[{role:'system',content:sys},{role:'user',content:'Transcript:\n'+q}]})});
      if(!res.ok)throw new Error(await errMsg(res));
      await readSSE(res,ln=>{try{const j=JSON.parse(ln);const d=((j.choices||[])[0]||{}).delta||{};if(d.content)onDelta(d.content);}catch(_){}});
    }catch(e){ if(/Failed to fetch|NetworkError/i.test(e.message))throw new Error(e.message+' — questo provider può bloccare le chiamate dal browser (CORS). Prova Gemini, Claude, OpenAI o Groq.'); throw e; }
  }
  async function suggest(qOverride){
    if(!canRun()){setS(liveStatus,cantRunMsg(),'err');showSettings();return;}
    if(qOverride){finalText=(finalText+' '+qOverride).trim();}
    if(!finalText.trim()){setS(liveStatus,t('noq'),'err');return;}
    busy=true;suggestBtn.disabled=true;setS(liveStatus,t('thinking'),'work');let acc='';answerEl.textContent='';clearRouting();
    answerEl.setAttribute('data-ph',t('thinking')); // "sto pensando…" nel riquadro risposta
    try{await callStream(tx=>{acc+=tx;lastAnswer=acc;answerEl.innerHTML=acc.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');answerEl.scrollTop=answerEl.scrollHeight;});setS(liveStatus,t('ready'),'ok');}
    catch(e){setS(liveStatus,'Error: '+e.message,'err');}
    answerEl.setAttribute('data-ph','—');
    busy=false;suggestBtn.disabled=false;
  }
  suggestBtn.addEventListener('click',()=>suggest());
  $('manualQ').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){suggest(e.target.value.trim());e.target.value='';}});
  $('copyBtn').addEventListener('click',()=>{if(!lastAnswer)return;try{navigator.clipboard.writeText(lastAnswer);$('copyBtn').textContent=t('copied');setTimeout(()=>$('copyBtn').textContent=t('copy'),1500);}catch(_){}});

  $('floatBtn').addEventListener('click',async()=>{
    const box=$('answerBox');
    if(!('documentPictureInPicture' in window)){const w=document.querySelector('.wrap');w.style.maxWidth=(w.style.maxWidth==='440px')?'960px':'440px';return;}
    try{const pip=await documentPictureInPicture.requestWindow({width:440,height:560});
      document.querySelectorAll('style').forEach(s=>pip.document.head.appendChild(s.cloneNode(true)));
      pip.document.body.style.cssText='margin:0;background:#fbf7f2;color:#2c2521;font-family:inherit;padding:12px;';
      pip.document.body.appendChild(box);
      pip.addEventListener('pagehide',()=>$('liveHome').appendChild(box));
    }catch(e){setS(liveStatus,'Float: '+e.message,'err');}
  });

  $('langswitch').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;LANG=b.getAttribute('data-lang');[...$('langswitch').children].forEach(c=>c.classList.toggle('on',c===b));applyLang();save();});
  ['model','baseUrl','lang','ansLang','mode'].forEach(id=>$(id).addEventListener('change',save));
  $('apiKey').addEventListener('input',()=>{suggestBtn.disabled=!$('apiKey').value.trim();save();});
  $('remember').addEventListener('change',save);
  $('forget').addEventListener('click',e=>{e.preventDefault();KEYS.forEach(store.del);PKEYS.forEach(p=>{store.del('v5_key_'+p);store.del('v5_model_'+p);store.del('v5_base_'+p);});$('apiKey').value='';PF_IDS.forEach(id=>$(id).value='');setS(setupStatus,t('valid'),'ok');});

  (function init(){
    if(store.get('v5_remember')==='0')$('remember').checked=false;
    LANG=store.get('v5_lang')|| (function(){var n=(navigator.language||navigator.userLanguage||'en').toLowerCase(); if(n.indexOf('it')===0)return'it'; if(n.indexOf('zh')===0)return'zh'; if(n.indexOf('es')===0)return'es'; return 'en';})();
    [...$('langswitch').children].forEach(c=>c.classList.toggle('on',c.getAttribute('data-lang')===LANG));
    if(store.get('v5_prov')&&PROVIDERS[store.get('v5_prov')])providerEl.value=store.get('v5_prov');
    proMode=store.get('v6_pro')==='1';
    $('sensToggle').checked=store.get('v6_sens')==='1';
    const pv=providerEl.value; const which=proMode?'choicePro':(pv==='gemini'?'choiceFree':(pv==='ollama'?'choiceLocal':'choiceOwn')); selChoice(which); $('ownWrap').style.display=(which==='choiceOwn')?'':'none';
    if(proMode)refreshMe();
    buildModeOptions();if(store.get('v5_mode'))modeEl.value=store.get('v5_mode');
    if(store.get('v5_heard'))$('lang').value=store.get('v5_heard');
    if(store.get('v5_ans'))$('ansLang').value=store.get('v5_ans');
    PF_IDS.forEach(id=>{const v=store.get(PF_KEYS[id]);if(v)$(id).value=v;});
    // Migrazione dal vecchio campo libero "contesto/CV": finisce in CV/esperienza.
    if(!$('pfCv').value&&store.get('v5_ctx'))$('pfCv').value=store.get('v5_ctx');
    autoMode=store.get('v5_auto')!=='0';autoBtn.classList.toggle('on',autoMode);
    syncProvider();applyLang();
  })();

  /* ---- Vista Impostazioni: schermata alternativa alla Live, non un overlay ---- */
  function showSettings(){ $('viewLive').style.display='none'; $('viewSettings').style.display='flex'; window.scrollTo(0,0); }
  function showLive(){ $('viewSettings').style.display='none'; $('viewLive').style.display='flex'; window.scrollTo(0,0); }
  $('settingsBtn').addEventListener('click',showSettings);
  $('backBtn').addEventListener('click',showLive);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('viewSettings').style.display!=='none') showLive(); });
  // Primo avvio senza configurazione: si parte DIRETTAMENTE dalla schermata
  // Impostazioni (una vista, non un pop-up sopra la Live). "Configurato" =
  // c'è una chiave/modalità locale, oppure era stata scelta la modalità Pro
  // (il login si verifica in async: non riaprire le impostazioni nell'attesa).
  if(!canRun() && store.get('v6_pro')!=='1') showSettings();
  /* Privacy: la trascrizione non viene mai salvata; la azzero anche alla chiusura. */
  window.addEventListener('pagehide',()=>{ finalText=''; });

  /* ---- Ponte per l'app desktop ----
     La cattura nativa (WASAPI) e la trascrizione on-device vivono nell'overlay
     Tauri; da qui entrano nella pipeline suggerimenti ESISTENTE del client.
     Nel browser normale l'oggetto esiste ma nessuno lo chiama: zero effetti. */
  window.lccCopilot={
    addTranscript(source,text){
      const who=source==='mic'?'Io':'Interlocutore';
      finalText+=who+': '+String(text).trim()+'\n';
      render('');
    },
    suggest(){ return suggest(); },
    isBusy(){ return busy; }
  };
  if(window.__TAURI__){
    // Su desktop la cattura nativa sostituisce l'ascolto del browser:
    // il microfono non va duplicato.
    listenBtn.disabled=true;
    listenBtn.title=t('desktopMic');
  }

  /* ---- PWA: installable app (like Zoom) ---- */
  let deferredPrompt=null;
  const installBtn=$('installBtn');
  function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }
  window.addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); deferredPrompt=e; if(!isStandalone()) installBtn.style.display=''; });
  installBtn.addEventListener('click',async()=>{
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    try{ await deferredPrompt.userChoice; }catch(_){}
    deferredPrompt=null; installBtn.style.display='none';
  });
  window.addEventListener('appinstalled',()=>{ deferredPrompt=null; installBtn.style.display='none'; setS(liveStatus,t('installed'),'ok'); });
  if(isStandalone()) installBtn.style.display='none';

  /* service worker: enables offline shell + install. Only over http(s), not file://. */
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }
})();
</script>
</body>
